# Publish the site: the editor, the examples, and the bundle they load.
#
# dist/ is gitignored, so a checkout does not contain it and a branch deploy cannot serve it. This job builds it.
# The build runs `nix run .#build`, the same command as in the README, so there is one definition of the build.
#
# Setup, one time: set Settings -> Pages -> Build and deployment -> Source to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false     # let a running publish finish rather than half-replacing a live site

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      # The cheap gates: no browser, seconds each. A red one stops the publish. The Chromium suites
      # (pixels, editor, embed-check) stay local — they need Playwright's own browser, outside nix.
      - name: Unit tests
        run: nix develop -c bun test *.test.js
      - name: Lint
        run: nix run .#lint
      - name: Shaders
        run: nix shell nixpkgs#nodejs_22 nixpkgs#glslang -c node glslcheck.mjs

      - name: Build the bundle
        run: nix run .#build      # writes dist/komorebi.player.min.js and prints the size table

      # The eljojo.net homepage loads THIS one, not the player bundle: its three looks open none of the fall tiers (the sky fill, the leaf's diffuse share, the autumn
      # pigment, the exposure pass, abscission, the litter carpet), and a bundle built for them leaves those out. It is published beside the player bundle, so it is also there
      # to download; the README tells embedders to serve their own copy of either.
      - name: Build the homepage bundle
        run: nix run .#embed -- 'morning 2' 'afternoon 5b' 'morning 3'      # writes dist/komorebi.embed.min.js

      # The site is the repo without the git data, this workflow and the pixel harness. New files ship
      # automatically, because the list is exclusions and not inclusions.
      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'test-gl' --exclude 'flake.*' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
