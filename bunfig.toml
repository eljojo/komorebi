[test]
# Other checkouts (git worktrees under .claude/) and the review archives' exported trees under test-gl/out/ carry
# their own copies of every test; a bare `bun test` would run them all, against code that is not this checkout's.
# test-gl's *.test.mjs are node:test suites, run with `node --test` as each one's header says. arboretum/ has its own
# suite, vitest in the Workers runtime (`npm test` there); render/ has its own node:test suite (`nix run .#render-test`).
pathIgnorePatterns = [".claude/**", "test-gl/out/**", "test-gl/*.test.mjs", "arboretum/**", "render/**"]
