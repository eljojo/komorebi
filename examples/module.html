<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Komorebi — as ES modules</title>
    <style>
      body { margin: 0; background: #f9f9f9; color: #333; font: 300 20px/1.5 'Helvetica Neue', Helvetica, sans-serif; }
      #komorebi { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; background: #f9f9f9; }
      main { max-width: 34em; padding: 12vh 24px; }
      h1 { font: 400 2.2em/1 Georgia, serif; margin: 0 0 .6em; }
      code { background: rgba(0,0,0,.06); padding: 0 .3em; border-radius: 3px; }
    </style>
  </head>
  <body>
    <canvas id="komorebi"></canvas>
    <main>
      <h1>ES modules</h1>
      <p>The engine is a set of ES modules. The <code>window.Komorebi</code> bundle is a wrapper around them.
        Import the modules if you have a bundler, or if you serve the files as they are.</p>
      <p>Serve ES modules over http(s). A page on <code>file://</code> cannot import them.</p>
    </main>

    <script type="module">
      // The same API as the bundle, without the global. These paths are relative to this file. On your own
      // site they point to your copies of komorebi.js, presets.js and the komorebi-*.js modules.
      import { create } from '../komorebi.js';
      import { PRESETS } from '../presets.js';

      try {
        const eng = create(document.getElementById('komorebi'), {
          // A look is a plain object. Copy one and set the parameters you want.
          params: { ...PRESETS['morning 3'], wind_strength: 0.8 },
          // onFrame runs after each frame. eng.fps, eng.motion and eng.params are current here.
          onFrame: () => {},
        });
        document.addEventListener('visibilitychange', () => eng.setPaused(document.hidden));
      } catch (e) { /* no WebGL2 / float targets */ }
    </script>
  </body>
</html>
