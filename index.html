<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Komorebi — editor</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0a0d0a; overflow:hidden; }
  #gl { display:block; width:100vw; height:100vh; cursor:crosshair; touch-action:none;   /* none: let swipe gestures through, no scroll/pull-to-refresh */
        -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }   /* and no iOS text-selection callout on a held finger */
  #hud {                                              /* bottom-right, above #hint — clear of the left dev panel */
    position:fixed; right:10px; bottom:38px; text-align:right; font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;
    color:#9fb89f; background:rgba(0,0,0,.35); padding:6px 8px; border-radius:6px;
    pointer-events:none; white-space:pre;
  }
  #hint {
    position:fixed; right:10px; bottom:10px; font:11px ui-monospace,monospace;
    color:#6b7d6b; background:rgba(0,0,0,.3); padding:4px 7px; border-radius:6px; pointer-events:none;
  }
  #dev {
    position:fixed; top:0; left:0; height:100vh; width:280px; box-sizing:border-box;
    overflow-y:auto; padding:8px 10px 40px; background:rgba(8,12,8,.82);
    backdrop-filter:blur(6px); border-right:1px solid #1c2a1c;
    font:11px/1.3 ui-monospace,Menlo,Consolas,monospace; color:#cfe0cf;
  }
  #dev.hidden { display:none; }
  #dev h2 { font-size:11px; margin:14px 0 4px; color:#7fae7f; text-transform:uppercase; letter-spacing:.08em; }
  #dev h2:first-child { margin-top:2px; }
  #dev details { margin:0; }
  #dev summary { list-style:none; cursor:pointer; }
  #dev summary::-webkit-details-marker { display:none; }
  #dev summary::before { content:'▸ '; color:#5a7a5a; }
  #dev details[open] > summary::before { content:'▾ '; }
  #dev summary.sec { font-size:11px; margin:14px 0 4px; color:#7fae7f; text-transform:uppercase; letter-spacing:.08em; }
  #dev summary.adv { font-size:11px; margin:8px 0 3px; color:#6f8a6f; }
  /* the look as the advanced panel's heading: ‹ name ›, the name being the dropdown (the select lies over it, unseen) */
  #dev .lookhead { display:flex; align-items:center; gap:8px; margin:10px 0 2px; }
  #dev .lookhead button { flex:0 0 auto; background:none; color:#aab5a2; border:1px solid rgba(241,231,207,.18); border-radius:16px; padding:3px 12px; font-size:15px; cursor:pointer; }
  #dev .lookhead .pick { position:relative; flex:1; min-width:0; text-align:center; }
  #dev .lookhead .name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#f1e7cf;
    font:italic 400 18px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }
  #dev .lookhead .name::after { content:' ▾'; font-size:11px; font-style:normal; color:#6f7a6b; }
  #dev .lookhead select { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
  #dev .look-chip { font-size:11px; color:#9fb89f; margin:0 0 8px; text-align:center; word-break:break-word; }
  #dev .lookacts button.main { flex:1; background:rgba(241,231,207,.1); color:#f1e7cf; border-color:rgba(241,231,207,.35); padding:5px 8px; }
  #dev .modes button { background:none; color:#aab5a2; border:1px solid rgba(241,231,207,.18); border-radius:16px; padding:4px 12px; cursor:pointer;
    font:italic 13px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }   /* the same "less" as the playful sidebar's */
  #dev .modes button:hover { color:#f1e7cf; background:rgba(241,231,207,.08); }
  #dev .devbeta { margin:22px 0 6px; } #dev .devbeta label { flex:1; color:#6f8a6f; }
  .ctl { display:flex; align-items:center; gap:6px; margin:3px 0; }
  /* an INERT row (one this look's camera never reads) hides itself; .ctl's display:flex would otherwise
     out-rank the UA's [hidden] rule, and an empty section takes its heading with it */
  #dev .ctl[hidden], #dev h2[hidden], #dev details[hidden] { display:none; }
  .ctl label { flex:0 0 96px; color:#9fb89f; }
  .ctl input[type=range] { flex:1; min-width:0; height:14px; accent-color:#c99; }
  .ctl .val { flex:0 0 46px; text-align:right; color:#e8d9a8; }
  .ctl.toggle label, .ctl.select label { flex:0 0 96px; }
  .ctl select { flex:1; background:#10180f; color:#cfe0cf; border:1px solid #243; }
  .ctl button { background:#1a2a1a; color:#cfe0cf; border:1px solid #2c452c; border-radius:4px; padding:3px 8px; cursor:pointer; }
  .ctl button:hover { background:#243c24; }
  .err { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
         color:#e88; font:14px ui-monospace,monospace; text-align:center; padding:40px; }

  /* ---- PLAYFUL editor (the default mode): the same sidebar language as #dev, fewer and larger controls ---- */
  #play {
    position:fixed; top:0; left:0; height:100vh; width:264px; box-sizing:border-box;
    overflow-y:auto; padding:12px 14px 40px; background:rgba(8,12,8,.78);
    backdrop-filter:blur(6px); border-right:1px solid #1c2a1c;
    font:12px ui-monospace,Menlo,Consolas,monospace; color:#cfe0cf;
    transition: transform .6s cubic-bezier(.22,.61,.36,1), background-color .2s, border-color .2s;
  }
  #play.hidden { display:none; }
  #play.offscreen { transform:translateX(-100%); }
  #play h2 { font-size:11px; margin:16px 0 6px; color:#7fae7f; text-transform:uppercase; letter-spacing:.08em; }
  #play .ctl { margin:8px 0; }
  #play .ctl label { flex:0 0 64px; }
  #play input[type=range] { height:22px; }        /* finger-sized */
  #play .ctl.off { opacity:.35; }
  #play .ctl.off input { pointer-events:none; }
  #play .modes { display:flex; gap:6px; margin-bottom:4px; }
  #play .modes button, #strip button { background:rgba(26,42,26,.7); color:#9fb89f; border:1px solid #2c452c;
    border-radius:12px; padding:4px 12px; cursor:pointer; font:11px ui-monospace,monospace; }
  #play .modes button:hover { color:#e8d9a8; background:#243c24; }
  #play .preset { display:flex; align-items:center; gap:8px; margin:6px 0 2px; }
  #play .preset .name { flex:1; text-align:left; color:#e8d9a8; font-size:13px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  #play .preset button { flex:0 0 auto; font-size:14px; padding:4px 12px; }
  /* the try-out dials: end words above, a tick at the look's own value on the track; in the playful sidebar and the zen strip */
  :is(#play,#strip) .try .ends { display:flex; justify-content:space-between; font-style:italic; font-size:10px; color:#6f8a6f; }
  :is(#play,#strip) .try .name { color:#9fb89f; }
  :is(#play,#strip) .try .track { position:relative; }
  :is(#play,#strip) .try .track input { display:block; width:100%; }
  :is(#play,#strip) .try .tick { position:absolute; top:50%; width:2px; height:8px; margin:-4px 0 0 -1px; background:#e8d9a8; pointer-events:none; }
  #play .ctl.try { display:block; }
  #strip .ctl.try { display:grid; grid-template-columns:auto 1fr; align-items:center; column-gap:8px; }   /* name and end words share a line, so the strip stays one slim row */
  #strip .ctl.try .track { grid-column:1 / -1; }
  :is(#play,#strip) .try.off input { pointer-events:none; }
  #play .tryreset { background:rgba(26,42,26,.7); color:#9fb89f; border:1px solid #2c452c; border-radius:6px; padding:4px 10px; cursor:pointer; }
  /* the wind pad: x = gust character, y = strength */
  #play .pad { position:relative; height:120px; margin:6px 0; border-radius:8px;
    background:linear-gradient(to top, rgba(28,42,28,.7), rgba(16,24,15,.7)); border:1px solid #243;
    cursor:crosshair; touch-action:none; }
  #play .pad .dot { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    background:#e8d9a8; box-shadow:0 0 10px rgba(232,217,168,.5); pointer-events:none; }
  #play .pad .padlab { position:absolute; right:6px; bottom:4px; color:#5a7a5a; font-size:10px; pointer-events:none; }

  /* ---- MINIMALIST editor: one translucent strip along the bottom, auto-fading ---- */
  #strip {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:8;
    width:min(520px, calc(100vw - 24px)); box-sizing:border-box; padding:10px 14px;
    background:rgba(8,12,8,.55); backdrop-filter:blur(8px);
    border:1px solid rgba(28,42,28,.8); border-radius:14px;
    font:12px ui-monospace,Menlo,Consolas,monospace; color:#cfe0cf;
    transition: opacity .3s ease, transform .6s cubic-bezier(.22,.61,.36,1), background-color .2s, border-color .2s;   /* appears quickly... */
  }
  /* touch: a finger on a slider clears the rest of the panel so the picture shows (children keep their place; only the held row stays) */
  /* the playful sidebar and the dials speak in the welcome's face and warm light, not the terminal's */
  #play { font:14px/1.3 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; color:#e9ecdf; background:rgba(14,17,13,.76); border-right:1px solid rgba(241,231,207,.14); }
  #play .ctl label { color:#aab5a2; font-style:italic; }
  #play input[type=range] { accent-color:#f1e7cf; height:26px; }
  #play .modes button, #play .preset button, #play .ctl button, #play .tryreset { background:none; color:#aab5a2; border:1px solid rgba(241,231,207,.18);
    border-radius:16px; padding:4px 12px; cursor:pointer; font:italic 13px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }
  #play .modes button:hover, #play .ctl button:hover { color:#f1e7cf; background:rgba(241,231,207,.08); }
  #play .preset .name { color:#f1e7cf; font-style:italic; font-size:16px; }
  #play .ctl.try { display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; margin:12px 0 4px; }
  #play .try .ends { display:contents; font-size:12.5px; color:#aab5a2; }
  #play .try .ends span:first-child { grid-column:1; grid-row:1; }
  #play .try .ends span:last-child { grid-column:3; grid-row:1; text-align:right; }
  #play .try .name { grid-column:2; grid-row:1; color:#e9ecdf; font-size:14px; }
  #play .try .track { grid-column:1 / -1; }
  :is(#play,#strip) .try .tick { background:#f1e7cf; opacity:.75; }
  #play .acts { display:flex; gap:8px; justify-content:space-between; }
  #play details.more { margin:14px 0 10px; }
  #play details.more summary { cursor:pointer; color:#aab5a2; font-style:italic; list-style:none; }
  #play details.more summary::before { content:'▸ '; } #play details.more[open] summary::before { content:'▾ '; }
  #play select { font:inherit; }
  /* the one sentence a moving dial says: it holds its line so nothing shifts when it speaks */
  :is(#play,#strip) .cap { min-height:2.5em; display:flex; align-items:center; justify-content:center; text-align:center; font-style:italic; font-size:13px;
    line-height:1.25; color:#f1e7cf; text-shadow:0 1px 10px rgba(0,0,0,.7); opacity:0; transition:opacity .5s ease; pointer-events:none; }
  :is(#play,#strip) .cap.on { opacity:1; }
  #strip.wide .cap { display:none; }
  #strip.one .cap { position:absolute; left:0; right:0; bottom:100%; margin-bottom:8px; min-height:0; font-size:15px; }   /* above the card, so the card is only the dial and the words */
  #play > *, #strip > * { transition: opacity .2s; }
  :is(#play,#strip,#dev).holding { background:transparent; border-color:transparent; backdrop-filter:none; }
  /* everything goes but the held row, what is inside it, what contains it, and the caption line */
  :is(#play,#strip,#dev).holding *:not(.held):not(.held *):not(:has(.held)):not(.cap) { opacity:0; }
  #strip.offscreen { transform:translate(-50%, 200%); }
  #strip.faded { opacity:0; pointer-events:none; transition: opacity .9s ease, transform .6s cubic-bezier(.22,.61,.36,1); }   /* ...retires gently */
  /* desktop (fine pointer): one horizontal bar, shown by cursor PROXIMITY rather than a timer */
  #strip.wide { width:min(880px, calc(100vw - 24px)); display:flex; align-items:center; gap:16px; padding:10px 16px; }
  #strip.hidden { display:none; }   /* AFTER .wide in the cascade — equal specificity, and hidden must always win */
  #strip.wide .preset { flex:0 0 auto; margin:0; gap:6px; }
  #strip.wide .preset .name { max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #strip.wide .ctl { flex:1 1 0; margin:0; min-width:0; }
  #strip.wide .ctl label { flex:0 0 auto; }
  #strip .preset { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #strip .preset .name { flex:1; text-align:left; color:#e8d9a8; font-size:13px; }
  #strip .ctl { display:flex; align-items:center; gap:8px; margin:5px 0; }
  #strip .ctl label { flex:0 0 56px; color:#9fb89f; }
  #strip .ctl input[type=range] { flex:1; min-width:0; height:20px; accent-color:#c99; }
  #strip .preset .more { flex:0 0 auto; margin-left:10px; padding:2px 9px; color:#7fae7f; }   /* rides the preset row, clear of ‹ › */
  /* touch: one dial at a time above a row of words (the welcome's face, not the terminal's) */
  #strip.one { padding:10px 12px 9px; border-radius:20px; font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }
  #strip.one .preset, #strip.one .ctl.out, #strip.one .ctl label, #strip.one .try .name { display:none; }
  #strip.one .ctl { margin:0 0 6px; }
  #strip.one .ctl.try:not(.out) { display:block; }
  #strip.one .try .ends { font-size:13px; color:#aab5a2; }
  #strip.one input[type=range] { height:32px; accent-color:#f1e7cf; }
  #strip.one .tabs { display:flex; gap:5px; }
  #strip.one .tabs button { flex:1 1 0; min-width:0; padding:7px 0; border-radius:16px; background:none; color:#aab5a2;
    border:1px solid rgba(241,231,207,.16); font:italic 14px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }
  #strip.one .tabs button.on { color:#14170f; background:#f1e7cf; border-color:#f1e7cf; }
  #strip.one .tabs button.sm { flex:0 0 34px; font-style:normal; }
  #tip {
    position:fixed; max-width:300px; z-index:10; pointer-events:none; display:none;
    font:11px/1.55 ui-monospace,Menlo,Consolas,monospace; color:#dfe9df;
    background:rgba(10,16,10,.97); border:1px solid #2c452c; border-radius:6px;
    padding:8px 10px; box-shadow:0 8px 28px rgba(0,0,0,.55);
  }
  #tip b { color:#cbe6a8; font-weight:600; }

  /* ---- auto-profiler: cost breakdown panel (sits beside the dev panel) ---- */
  #prof { position:fixed; left:300px; top:8px; width:300px; max-height:92vh; overflow:auto; z-index:20;
    font:11px/1.45 ui-monospace,Menlo,Consolas,monospace; color:#cfe0cf;
    background:rgba(8,12,8,.95); border:1px solid #2c452c; border-radius:8px; padding:10px 12px; display:none; }
  #prof.show { display:block; }
  #prof h3 { margin:6px 0 8px; color:#7fae7f; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  #prof h3:first-child { margin-top:0; }
  #prof .row { margin:5px 0; overflow:hidden; }
  #prof .k { color:#9fb89f; } #prof .v { color:#e8d9a8; float:right; }
  #prof .bar { height:6px; background:#1c2a1c; border-radius:3px; margin:2px 0 7px; overflow:hidden; }
  #prof .bar i { display:block; height:100%; background:#c99; }
  #prof .warn { color:#e8b06a; margin:8px 0; line-height:1.5; }
  #prof button { background:#1a2a1a; color:#cfe0cf; border:1px solid #2c452c; border-radius:4px; padding:3px 8px; cursor:pointer; }
  /* ---- auto-profiler: A/B wipe (variant on a stacked canvas, current beneath, draggable divider) ---- */
  #cmp { position:fixed; inset:0; z-index:25; display:none; }
  #cmp.show { display:block; }
  #cmpCanvas { position:absolute; inset:0; width:100vw; height:100vh; display:block; }   /* variant, clipped left of the divider */
  #cmpBar { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:#f0e0a8; cursor:ew-resize; z-index:26;
    box-shadow:0 0 12px rgba(240,224,168,.6); touch-action:none; }
  #cmpBar::after { content:'↔'; position:absolute; top:50%; left:-9px; color:#0a0d0a; background:#f0e0a8; border-radius:10px;
    width:16px; height:16px; line-height:16px; text-align:center; font:11px monospace; transform:translateY(-50%); }
  #cmpInfo { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:27; display:none; gap:8px; align-items:center;
    font:11px ui-monospace,monospace; color:#cfe0cf; background:rgba(8,12,8,.92); border:1px solid #2c452c; border-radius:8px; padding:8px 10px; }
  #cmpInfo .cuts { color:#9fb89f; max-width:42vw; }
  #cmpInfo button { background:#1a2a1a; color:#cfe0cf; border:1px solid #2c452c; border-radius:4px; padding:4px 9px; cursor:pointer; }
  #cmpInfo .pill { padding:4px 9px; border-radius:12px; background:#10180f; cursor:pointer; border:1px solid #243; }
  #cmpInfo .pill.on { background:#243c24; color:#e8d9a8; border-color:#3c5c3c; }
  /* per-engine fps, one each side of the wipe: variant (left, gold like the divider) vs current (right) */
  #cmpFps { position:fixed; top:10px; left:0; right:0; z-index:27; display:none; justify-content:space-between;
    padding:0 14px; font:12px ui-monospace,monospace; color:#cfe0cf; pointer-events:none; }
  #cmpFps.show { display:flex; }
  #cmpFps span { background:rgba(8,12,8,.85); border:1px solid #2c452c; border-radius:6px; padding:4px 9px; }
  #cmpFps .vlabel { color:#f0e0a8; }

  /* ---- welcome gate: a faint 'memories' background under an intro overlay ---- */
  #gl { transition: opacity 1.6s ease; }
  #gl.still { cursor: none; }                       /* the pointer has rested on the picture: it steps out of the way until it moves */
  body.intro #gl { opacity: .33; }                  /* super-faint teaser of the look */
  #welcome {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    background: radial-gradient(ellipse at center, rgba(8,12,8,.5) 0%, rgba(8,12,8,.12) 58%, rgba(8,12,8,0) 100%);
    transition: opacity .9s ease, filter .9s ease, transform .9s ease;
  }
  #welcome.out { opacity: 0; filter: blur(10px); transform: scale(1.04); pointer-events: none; }
  #welcome .w { max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 22px;
    animation: welcome-in 1.4s ease both; }
  @keyframes welcome-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #welcome h1 { margin: 0; font: 300 clamp(42px, 9vw, 78px)/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    letter-spacing: .03em; color: #f2f6ee; text-shadow: 0 2px 30px rgba(0,0,0,.5); }
  #welcome h1 .jp { display: block; margin-top: .38em; font-size: .3em; letter-spacing: .5em;
    color: #9fb89f; font-weight: 400; text-indent: .5em; }   /* indent balances the trailing letter-space */
  #welcome p { margin: 0; max-width: 30em; color: #cedcc5; text-shadow: 0 1px 16px rgba(0,0,0,.55);
    font: 400 clamp(15px,2.2vw,19px)/1.65 ui-serif,Georgia,"Times New Roman",serif; }
  #welcome .feel { margin-top: 8px; cursor: pointer; color: #f1e7cf;            /* warm sunlight, not terminal green */
    font: italic 400 clamp(19px,2.7vw,23px)/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    letter-spacing: .015em; padding: 10px 32px; border-radius: 40px;
    background: rgba(240,224,168,.05); border: 1px solid rgba(232,217,168,.30);
    box-shadow: 0 0 0 rgba(240,224,168,0);
    transition: color .45s ease, background .45s ease, border-color .45s ease, box-shadow .55s ease, transform .35s ease; }
  #welcome .feel:hover { color: #fff8e6; background: rgba(240,224,168,.11); border-color: rgba(240,224,168,.6);
    box-shadow: 0 0 34px rgba(240,224,168,.28); transform: translateY(-1px); }   /* light blooming through */
  #welcome .feel:active { transform: translateY(0); }
  /* two plain links beneath "feel": quiet, so "feel" stays the one primary action */
  #welcome .more { display: flex; gap: .7em; align-items: baseline; margin-top: -4px;
    font: italic 400 clamp(15px,2vw,16px)/1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; letter-spacing: .015em; }
  #welcome .more a { color: #9fb89f; text-decoration: none; transition: color .45s ease; }
  #welcome .more a:hover, #welcome .more a:focus-visible { color: #f1e7cf; }
  #welcome .more a[hidden] { display: none; }
  #welcome .more #arbLink::after { content: "·"; margin-left: .7em; color: #9fb89f; }   /* the dot goes with the link it follows, so it hides with it */
  /* "about", in place: about.html's column (styled by about.css, fetched by editor.js) laid over the same canvas. It breathes in and
     out as the welcome does (#welcome.out); taller than the screen, it scrolls here. */
  #aboutView { position: fixed; inset: 0; z-index: 31; overflow-y: auto; overscroll-behavior: contain; outline: none;
    transition: opacity .9s ease, filter .9s ease, transform .9s ease; }
  #aboutView.out { opacity: 0; filter: blur(10px); transform: scale(1.04); pointer-events: none; }
  /* dev panel slides in from the left on first reveal; afterwards D just toggles it */
  #dev { transition: transform .6s cubic-bezier(.22,.61,.36,1); }
  #dev.offscreen { transform: translateX(-100%); }
  /* key hints fade in once the editor arrives */
  #hint { transition: opacity .8s ease; }
  #hint.gone { opacity: 0; pointer-events: none; }
  /* the name of the look a touch swipe landed on, across the top (the welcome's own face) */
  #lookName { position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:9; max-width:calc(100vw - 32px); text-align:center;
    font: italic 400 17px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; color:#f1e7cf; text-shadow:0 1px 12px rgba(0,0,0,.6);
    opacity:0; transition:opacity .6s ease; pointer-events:none; }
  #lookName.show { opacity:1; }
</style>
</head>
