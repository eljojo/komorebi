<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Komorebi — editor</title>
<!-- ?v= gives iOS a new URL: it keeps an icon it fetched, or failed to fetch, by URL. Bump it here, in about.html,
     player.html and the manifest when the icons change. -->
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<style>
  /* ---- THE FACE: one palette and one type for every surface a person meets (the sidebar, the strip, Settings, the questions, the
     stories, the tips, the workspace): warm light on dark glass, in the welcome's serif, numbers in the mono. Every colour below is one
     of these. ---- */
  :root { color-scheme: dark;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono: ui-monospace,Menlo,Consolas,monospace;
    --ink: #e9ecdf;                     /* text */
    --soft: #aab5a2;                    /* a label, a quiet button */
    --faint: #7c8776;                   /* a hint, a count, a chevron */
    --warm: #f1e7cf;                    /* the light: a look's name, what is lit */
    --on-warm: #14170f;                 /* text on the light */
    --mark: #e7b86a;                    /* differs from the saved look */
    --edge: rgba(241,231,207,.18);      /* a control's outline */
    --line: rgba(241,231,207,.12);      /* a divider */
    --wash: rgba(241,231,207,.08);      /* under the pointer; a field */
    --lit: rgba(241,231,207,.14);       /* the one you are on, among others */
    --glass: rgba(14,17,13,.76);        /* a surface over the picture */
    --glass-hi: rgba(14,17,13,.94);     /* a surface to read: a question, a pinned bar */
    --clear: .45s ease;                 /* a held slider's surface fading away from the picture, and back */
    --pill: 16px; }
  /* its parts, at no specificity (:where), so a surface's own layout rules win without a fight. A lit button (.on) is the light. */
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) { font:14px/1.3 var(--serif); color:var(--ink); }
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) :is(button,select) { font:italic 13px var(--serif); color:var(--soft); background:none;
    border:1px solid var(--edge); border-radius:var(--pill); padding:4px 12px; }
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) button:hover:not(:disabled):not(.on) { color:var(--warm); background:var(--wash); }
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) button.on { color:var(--on-warm); background:var(--warm); border-color:var(--warm); }
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) select { color:var(--ink); background:var(--wash); }
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) option { background:var(--on-warm); }
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) input[type=range] { accent-color:var(--warm); }
  :where(#play,#strip,#dev,#plist,#wsTabs,#midi,.session-panel,dialog.ask,dialog.stories) label { color:var(--soft); font-style:italic; }
  :where(dialog.ask,dialog.stories,.session-panel) { box-sizing:border-box; padding:16px 18px 18px; background:var(--glass-hi); border:1px solid var(--edge); border-radius:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.35), 0 22px 70px 4px rgba(0,0,0,.6); }   /* a window's shadow: tight under it, wide and deep around */
  :where(dialog.ask,dialog.stories,.session-panel)::backdrop { background:rgba(4,6,4,.45); backdrop-filter:blur(3px); }
  /* Settings (editor-settings.js) */
  .session-panel { position:fixed; max-height:85vh; width:min(380px, calc(100vw - 32px)); overflow:auto; }
  .session-panel h2 { display:inline-block; margin:0 0 4px; font:italic 400 22px var(--serif); color:var(--warm); }
  .session-panel h2 + button { float:right; }
  .session-panel h3 { margin:18px 0 6px; font:italic 400 15px var(--serif); color:var(--warm); }
  .session-panel .ctl { margin:6px 0; }
  .session-panel .ctl span { flex:1; color:var(--soft); font-style:italic; }
  .session-panel .ctl select { flex:1; }
  .session-panel :is(p, div:not(.ctl)) { margin:6px 0; font-size:13px; color:var(--faint); }
  .session-panel summary { margin:6px 0; color:var(--soft); font-style:italic; cursor:pointer; }
  /* arboretum's lines (arboretum.js), wherever they hang: the workspace's look box, or Settings */
  .arb-inrow, .arb-move { flex-wrap:wrap; }
  .arb-chips { display:contents; }
  :is(.arb-status, .arb-move-text, .arb-who) { font-size:12px; color:var(--soft); word-break:break-word; }
  .arb-status { margin:2px 0 6px; }
  .arb-move-text { flex:1 1 100%; }
  .arb-in[aria-pressed=true] { color:var(--on-warm); background:var(--warm); border-color:var(--warm); }
  html,body { margin:0; height:100%; background:#0a0d0a; overflow:hidden; }
  #gl { display:block; width:100vw; height:100vh; cursor:move; touch-action:none;   /* none: let swipe gestures through, no scroll/pull-to-refresh */
        -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }   /* and no iOS text-selection callout on a held finger */
  #hint {
    position:fixed; right:10px; bottom:10px; font:italic 12px var(--serif); color:var(--soft); background:rgba(0,0,0,.3);
    padding:4px 8px; border-radius:8px; pointer-events:none;
  }
  #hint b { font:normal 11px var(--mono); color:var(--warm); }
  #dev { position:fixed; top:0; left:0; height:100vh; width:280px; box-sizing:border-box; overflow-y:auto; padding:8px 10px 40px; font-size:12.5px; }
  #dev.hidden { display:none; }
  /* THE WORKSPACE (editor.js, setWorkspace): the picture a viewer at the top left with nothing over it, the tree pane
     (tree-pane.js) beside it, and the advanced panel docked in the band below, its rows flowing in columns across the screen
     and scrolling sideways. */
  #tree { display:none; }
  body.workspace { background:#0e110d; }
  body.workspace #gl { position:fixed; left:0; top:0; width:62vw; height:62vh; }
  body.workspace #tree { display:block; position:fixed; top:0; right:0; width:38vw; height:62vh;
    border-left:1px solid var(--line); box-sizing:border-box; cursor:pointer; }
  body.workspace #dev { top:62vh; left:0; width:100vw; height:38vh; padding:8px 18px; background:#0e110d;
    border-top:1px solid var(--line); overflow-x:auto; overflow-y:hidden;
    column-width:260px; column-gap:30px; column-fill:auto; column-rule:1px solid rgba(241,231,207,.06); }
  body.workspace #dev .ctl, body.workspace #dev summary, body.workspace #dev h2 { break-inside:avoid; }
  body.workspace #dev.offscreen { transform: translateY(100%); }
  body.workspace #hint { bottom:auto; top:8px; right:auto; left:8px; }   /* over the viewer's top left, clear of the panel and the counter */
  /* the right-hand pane's two tabs, tree and playlist (editor.js setWsPane); the playlist pane (playlist-pane.js) stands where the tree does */
  #wsTabs, #plist { display:none; }
  body.workspace #wsTabs { display:flex; gap:4px; position:fixed; top:6px; right:8px; z-index:5; }
  #wsTabs button { padding:2px 12px; font-size:12px; }
  #wsTabs button:not(.on) { background:var(--glass); }   /* over the sky; the lit one is the light, as every lit button is */
  body.workspace.ws-playlist #tree { display:none; }
  body.workspace.ws-playlist #plist { display:flex; flex-direction:column; overflow-y:auto; position:fixed; top:0; right:0; width:38vw; height:62vh; box-sizing:border-box;
    padding:34px 12px 8px; border-left:1px solid var(--line); background:#0e110d; font-size:13px; }
  #plist .pl-slot .looks { display:flex; flex-direction:column; padding:0 4px 8px; }
  #plist .pl-slot .playlist-row { order:-2; } #plist .pl-slot .presentation-row { order:-1; }   /* in the pane the playlist leads, then the look */
  #plist .pl-slot .lookhead { margin-top:2px; }
  #plist .pl-remove { flex:0 0 22px; padding:0; border-color:transparent; font:13px/1 var(--serif); color:var(--faint); }
  #plist .pl-remove:hover:not(:disabled) { color:#e8a0a0; border-color:rgba(232,160,160,.35); background:none; }
  #plist .pl-remove:disabled { visibility:hidden; }
  #plist .pl-add { margin:8px 4px 0; }
  #plist .pl-add[hidden] { display:none; }
  #plist .pl-head { display:flex; align-items:baseline; gap:10px; padding:0 4px 6px; border-bottom:1px solid var(--line); }
  #plist .pl-count { flex:1; color:var(--faint); font-style:italic; }
  #plist .pl-cols { display:grid; grid-template-columns:62px 62px 52px; gap:6px; color:var(--faint); font-style:italic; font-size:12px; text-align:center; }
  #plist.editable .pl-cols { margin-right:28px; }   /* clear of the × column */
  #plist .pl-list { list-style:none; margin:0; padding:0; }   /* the whole pane scrolls: the looks box over the list may be tall */
  #plist .pl-row { display:flex; align-items:center; gap:6px; padding:3px 4px; border-top:2px solid transparent; border-bottom:2px solid transparent; }
  #plist .pl-row.on { background:var(--wash); }
  #plist .pl-row.on .pl-name { color:var(--warm); }
  #plist .pl-row.pending { opacity:.55; }
  #plist .pl-row.dragging { opacity:.4; }
  #plist .pl-row.drop-before { border-top-color:var(--warm); }
  #plist .pl-row.drop-after { border-bottom-color:var(--warm); }
  #plist .pl-grip { flex:0 0 14px; color:var(--faint); text-align:center; }
  #plist .pl-grip[draggable=true] { cursor:grab; }
  #plist .pl-grip[draggable=true]:active { cursor:grabbing; }
  #plist .pl-n { flex:0 0 22px; color:var(--faint); font:11px var(--mono); text-align:right; }
  #plist .pl-name { flex:1; min-width:0; padding:2px 0; border:none; border-radius:0; background:none; text-align:left; font:inherit; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #plist .pl-name:hover { color:var(--warm); background:none; }
  #plist input[type=number] { flex:0 0 62px; width:62px; box-sizing:border-box; padding:2px 6px; border-radius:8px; background:var(--wash);
    border:1px solid var(--edge); color:var(--ink); font:11px var(--mono); text-align:right; }
  #plist input[type=number]:disabled { color:var(--soft); border-color:transparent; background:none; }
  #plist .pl-style { flex:0 0 52px; padding:2px 0; font-size:12px; }
  #plist .pl-style:disabled { border-color:transparent; color:var(--soft); cursor:default; }
  #plist.busy { cursor:progress; }
  #plist.busy .pl-list { opacity:.7; pointer-events:none; }
  #wsStat { display:none; }
  body.workspace #wsStat { display:block; position:fixed; right:calc(38vw + 8px); top:8px; pointer-events:none; padding:2px 6px; border-radius:4px;
    font:11px var(--mono); color:var(--ink); background:var(--glass); }   /* the frame rate and resolution, quiet, in the viewer's top right, on any picture */
  /* the MIDI console (M, midi.js) docks at the right end of the band, the panel taking the rest; its caption rides the viewer */
  /* the MIDI console (midi.js): its caption rides the picture in the look-name's face; the console lists the desk's strips */
  #midiCap { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); z-index:9; text-align:center; pointer-events:none;
    font:italic 400 15px var(--serif); color:var(--warm); text-shadow:0 1px 12px rgba(0,0,0,.6); opacity:0; transition:opacity .6s ease; }
  #midiCap.on { opacity:.9; }
  #midiCap .bar, #midi .bar { position:relative; height:2px; background:rgba(241,231,207,.2); margin-top:6px; }
  #midiCap .bar { width:180px; margin:8px auto 0; }
  :is(#midiCap,#midi) .bar i { position:absolute; top:-2px; width:2px; height:6px; background:var(--warm); transform:translateX(-1px); }
  :is(#midiCap,#midi) .bar b { position:absolute; top:-3px; width:1px; height:8px; background:rgba(241,231,207,.45); }
  #midi { position:fixed; inset:auto 16px 16px auto; z-index:20; max-width:calc(100vw - 32px); max-height:calc(100vh - 32px); overflow:auto;
    background:var(--glass-hi); font-size:12.5px; padding:12px 14px; border:1px solid var(--edge); border-radius:12px; }
  #midi[hidden] { display:none; }
  #midi .grid { display:grid; grid-template-columns:repeat(9, 92px); gap:10px; margin:10px 0; }
  #midi .strip h4 { margin:0 0 4px; font:italic 400 14px var(--serif); color:var(--warm); }
  #midi .strip h4 .n { margin-right:5px; font:11px var(--mono); color:var(--faint); }
  #midi .row { margin-bottom:6px; } #midi .row.off { opacity:.35; } #midi .row.none { opacity:.15; }
  #midi button { margin-right:4px; padding:1px 8px; font-size:12px; }
  #midi .head { display:flex; gap:16px; align-items:baseline; }
  #midi pre { margin:0 0 0 auto; font:11px var(--mono); color:var(--soft); white-space:pre; }
  body.workspace #midi { inset:62vh 0 0 auto; width:min(820px, 55vw); max-width:none; max-height:none; height:38vh; box-sizing:border-box;
    border-radius:0; border-top:1px solid var(--line); border-left:1px solid var(--line); background:#0e110d; z-index:auto; }
  body.workspace #midi .grid { grid-template-columns:repeat(9, minmax(64px, 1fr)); gap:8px; }
  body.workspace:has(#midi:not([hidden])) #dev { width:calc(100vw - min(820px, 55vw)); }
  body.workspace #midiCap { bottom:auto; top:calc(62vh - 70px); left:31vw; }
  body.workspace #play, body.workspace #strip { display:none !important; }
  /* ---- THE DOCKED PANEL (the workspace's band): areas that open and close on their own (an option-click does them all), shelves
     folded inside them, one line per row. An area's ▸ hangs in the gutter and a shelf's box reaches into it, so an area's name, a
     shelf's and the rows under them all start on one edge. ---- */
  #dev details { margin:0; }
  #dev summary { position:relative; list-style:none; cursor:pointer; }
  #dev summary::-webkit-details-marker { display:none; }
  #dev summary::before { content:'▸'; position:absolute; left:-11px; top:.2em; font-size:10px; font-style:normal; color:var(--faint); }
  #dev details[open] > summary::before { content:'▾'; }
  #dev summary[data-changed]::after { content:'● ' attr(data-changed); margin-left:6px; font-size:10px; font-style:normal; color:var(--mark); }
  #dev :is(summary.sec, h2) { margin:12px 0 4px; font:italic 400 15px var(--serif); color:var(--warm); }
  #dev h2:first-child { margin-top:2px; }
  #dev details > details { margin:6px -8px 2px; padding:0 7px; border:1px solid var(--line); border-radius:8px; background:rgba(241,231,207,.02); }
  #dev summary.adv { padding:4px 0; font:italic 12.5px var(--serif); color:var(--soft); }
  #dev summary.adv::before, #dev details[open] > summary.adv::before { content:none; }   /* a shelf's box says it folds: no ▸ */
  #dev .machine { margin:18px 0 0; font-style:italic; font-size:12px; color:var(--faint); letter-spacing:.04em; }
  #dev .ws-head { flex-wrap:wrap; gap:6px; margin:6px 0 4px; }
  #dev .ws-count { flex:1; font-style:italic; color:var(--soft); }
  #dev .ws-head button { padding:2px 10px; font-size:12px; }
  #dev .ws-head [hidden] { display:none; }
  #dev .dot { color:var(--mark); font-size:10px; font-style:normal; }
  /* a row: its name, its track with a tick where the saved look has it, its value, and ↺ while it differs */
  #dev .ctl.setting { display:grid; grid-template-columns:96px minmax(0,1fr) 42px 14px; align-items:center; column-gap:6px; min-height:22px; margin:0; }
  #dev .ctl.setting > label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:help; }   /* a click says what it does */
  #dev .ctl.setting.changed > label { color:var(--ink); }
  #dev .ctl.setting .track { position:relative; display:block; min-width:0; }
  #dev .ctl.setting input[type=range] { display:block; width:100%; height:16px; margin:0; }
  #dev .ctl.setting .home { position:absolute; top:50%; width:2px; height:9px; margin:-4px 0 0 -1px; background:var(--warm); opacity:.5; pointer-events:none; }
  #dev .ctl.setting .home[hidden] { display:none; }
  #dev .ctl.setting .val { font:11px var(--mono); color:var(--soft); text-align:right; white-space:nowrap; }
  #dev .ctl.setting.changed .val { color:var(--mark); }
  #dev .ctl.setting .rs { grid-column:4; padding:0; border:none; background:none; font-size:12px; font-style:normal; color:var(--faint); }
  #dev .ctl.setting .rs:hover { color:var(--warm); background:none; }
  #dev .ctl.setting .rs[hidden] { display:none; }
  #dev .ctl.setting.toggle input { justify-self:start; margin:0; accent-color:var(--warm); }
  #dev .ctl.setting.select select { grid-column:2 / 4; min-width:0; padding:1px 8px; font-size:12px; }
  #dev .ctl.setting [data-inherit] { grid-column:2 / 4; justify-self:start; padding:0 8px; font-size:11px; }
  #dev .ctl.setting.btn { display:block; margin:6px 0; }
  #dev .ctl.setting.btn button { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; font-size:12px; }
  /* the look as the advanced panel's heading: ‹ name ›, the name being the dropdown (the select lies over it, unseen) */
  .looks .lookhead { display:flex; align-items:center; gap:8px; margin:10px 0 2px; }
  .looks .lookhead button { flex:0 0 auto; background:none; color:var(--soft); border:1px solid var(--edge); border-radius:var(--pill); padding:3px 12px; font-size:15px; cursor:pointer; }
  .looks .lookhead .pick { position:relative; flex:1; min-width:0; text-align:center; }
  .looks .lookhead .name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--warm);
    font:italic 400 18px var(--serif); }
  .looks .lookhead .name::after { content:' ▾'; font-size:11px; font-style:normal; color:var(--faint); }
  .looks .lookhead select { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
  .looks .look-note { font-size:12px; color:var(--warm); margin:-4px 0 8px; text-align:center; word-break:break-word; -webkit-user-select:text; user-select:text; }   /* where a save went */
  .looks .look-chip { font-size:12px; color:var(--soft); margin:0 0 8px; text-align:center; word-break:break-word; }
  .looks .stylerow button.on { background:var(--lit); color:var(--warm); border-color:rgba(241,231,207,.45); }   /* which of morph / fade this playlist item has */
  .ctl { display:flex; align-items:center; gap:6px; margin:3px 0; }
  /* an INERT row (one this look's camera never reads) hides itself; .ctl's display:flex would otherwise
     out-rank the UA's [hidden] rule, and an empty section takes its heading with it */
  #dev .ctl[hidden], #dev h2[hidden], #dev details[hidden], .looks .ctl[hidden] { display:none; }
  .ctl label, .ctl.toggle label, .ctl.select label { flex:0 0 96px; }
  .ctl input[type=range] { flex:1; min-width:0; }
  .ctl .val { flex:0 0 46px; text-align:right; }
  .ctl select { flex:1; }
  /* CURSORS. The editor's surfaces are controls, not text: an arrow over their words, a hand over what acts, the I-beam only in a
     field that takes typing, and a drag across them selects nothing. Arboretum's status line stays selectable: it is a message to copy. */
  :is(#dev,#play,#strip,#plist,#wsTabs,.session-panel,#midi,#welcome) { cursor:default; -webkit-user-select:none; user-select:none; }
  :is(#dev,#play,#strip,#plist,#wsTabs,.session-panel,#midi,#welcome) :is(button,select,summary,a,input[type=checkbox],input[type=range]) { cursor:pointer; }
  :is(#dev,#play,#strip,#plist,.session-panel,#midi) :is(button,select,input):disabled { cursor:default; }
  :is(#dev,#plist,.session-panel,#midi) :is(input[type=number],input[type=text],textarea) { cursor:text; -webkit-user-select:text; user-select:text; }
  .looks .arb-status { -webkit-user-select:text; user-select:text; }
  .err { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
         color:#e88; font:14px ui-monospace,monospace; text-align:center; padding:40px; }

  /* ---- THE SIDEBAR (#play): simple or advanced, beside the picture ---- */
  #play { position:fixed; top:0; left:0; height:100vh; width:264px; box-sizing:border-box; overflow-y:auto; padding:12px 14px 40px;
    background:var(--glass); backdrop-filter:blur(6px); border-right:1px solid var(--line);
    transition: transform .6s cubic-bezier(.22,.61,.36,1), opacity .18s ease, background-color var(--clear), border-color var(--clear), backdrop-filter var(--clear); }   /* opacity: it steps aside from the cursor (sideFade) */
  #play.hidden { display:none; }
  #play.offscreen { transform:translateX(-100%); }
  #play h2 { margin:16px 0 6px; font:italic 400 13px var(--serif); color:var(--soft); }
  #play .ctl { margin:8px 0; }
  #play .ctl label { flex:0 0 64px; }
  #play input[type=range] { height:26px; }        /* finger-sized */
  #play .ctl.off { opacity:.35; }
  #play .ctl.off input { pointer-events:none; }
  #play .ctl[hidden] { display:none; }   /* the playlist row, until there is a second list to swap to */
  #play .preset { display:flex; align-items:center; gap:8px; margin:6px 0 2px; }
  #play .acts { display:flex; gap:8px; justify-content:space-between; }
  #play details.more { margin:14px 0 10px; }
  #play details.more summary { color:var(--soft); font-style:italic; list-style:none; cursor:pointer; }
  #play details.more summary::before { content:'▸ '; } #play details.more[open] summary::before { content:'▾ '; }
  /* the wind pad: x = gust character, y = strength */
  #play .pad { position:relative; height:120px; margin:6px 0; border-radius:12px; background:var(--wash); border:1px solid var(--line);
    cursor:crosshair; touch-action:none; }
  #play .pad .dot { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    background:var(--warm); box-shadow:0 0 10px rgba(241,231,207,.5); pointer-events:none; }
  #play .pad .padlab { position:absolute; right:8px; bottom:5px; color:var(--faint); font-size:11px; font-style:italic; pointer-events:none; }

  /* ---- THE STRIP (#strip): the dials over the picture; one bar along the bottom (.wide), or one dial at a time over a row of words (.one) ---- */
  #strip {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:8;
    width:min(520px, calc(100vw - 24px)); box-sizing:border-box; padding:10px 14px;
    background:var(--glass); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:20px;

  }

  /* ---- what the sidebar and the strip share ---- */

  :is(#play,#strip) .preset .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left;
    color:var(--warm); font-style:italic; font-size:16px; cursor:pointer; }

  /* the try-out dials: end words either side of the name, over the track, a tick at the look's own value */
  :is(#play,#strip) .ctl.try { display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; column-gap:10px; }

  :is(#play,#strip) .cap { min-height:2.5em; display:flex; align-items:center; justify-content:center; text-align:center; font-style:italic; font-size:13px;

  :where(#play,#strip,#dev) * { transition: opacity var(--clear); }   /* zero specificity: a control's own transition still wins */
  :is(#play,#strip,#dev).holding { background:transparent; border-color:transparent; backdrop-filter:none; }

  #tip {

    padding:9px 12px; box-shadow:0 8px 28px rgba(0,0,0,.55);

  /* ---- welcome gate: a faint 'memories' background under an intro overlay ---- */

    padding: 24px; text-align: center;

  :is(#play,#dev) .modes { display:flex; align-items:center; gap:6px; margin-bottom:4px; }

  #play .modes { gap:4px; justify-content:space-between; }   /* ✕, the depths, ▶ and the cog spread evenly across the sidebar, none squeezed */

  /* ---- a question asked in the page (ask.js): over a fullscreen picture, where prompt() would leave fullscreen ---- */

  /* ---- the advanced depth (advanced.js): the look's name, the areas under it, and a bar pinned at the foot while something differs ---- */
  #play.deep { width:min(340px, 100vw); flex-direction:column; padding-bottom:0; }
