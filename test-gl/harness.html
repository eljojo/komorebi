<!doctype html>
<meta charset="utf-8">
<title>komorebi — real-WebGL2 pixel harness</title>
<!--
  The page half of the pixel harness (driven by run.js). It loads the raw engine + preset modules off the
  served repo root — no build, same files the editor and the player load — and exposes four functions the
  node runner calls through Playwright:

    __glinfo()                          the WebGL2 / EXT_color_buffer_float preflight
    __presets()                         the built-in look names, read from PRESETS (never hardcoded)
    __run(preset, overrides, frames, opts)  one engine, captured at the given rAF tick counts (opts.rebake: see below)
    __fillCheck(preset, overrides)      the sky fill's shader against komorebi-fill.js, on the layers the engine really baked
    __skyCheck(preset, overrides)       the sky view's shared ray (the lantern, wood read) against komorebi-fill.js's skyRayRef, on the layers and wood textures the engine really baked
    __rimCheck(preset, overrides)       the lantern's RIM: leaf glow at a soft edge against the same leaf's interior, through the shared ray, on the layers the engine baked (§4.5, a texel is a mixture)
    __haloCheck(preset, overrides)      the cast tap's HALO: the beam through a soft-edge texel (tap and tapCA, as the engine compiles them) against the mixture, on the layers the engine baked
    __stampCheck(opts)                  the faithful stamp's edge band: FS_FAITH, as the engine compiles it, drawn for one leaf and held to the per-leaf mixture
    __fillToggle(preset, overrides)     canopy_fill opened and shut on a RUNNING engine: what it allocates, frees, and the frames either side
    __liveChange(preset, over, key, value)  one param changed on a RUNNING engine (nothing rebuilt), the frame after it — for knobs that tween
    __diff(idA, idB) / __png(id)        exact byte comparison + the PNG artifact

  WHY THE CAPTURE HAPPENS INSIDE onFrame: the context is created without preserveDrawingBuffer, so the
  drawing buffer is undefined once the frame is composited. readPixels is only meaningful from inside the
  rAF callback that drew it — onFrame is the engine's hook at exactly that point.
-->
<style>
  html, body { margin: 0; background: #000; }
  /* The engine sizes its backing store from clientWidth/Height × dpr — so a fixed CSS box (with the runner
     pinning deviceScaleFactor to 1) is what makes the capture resolution reproducible. */
  canvas.stage { position: absolute; top: 0; left: 0; width: 320px; height: 180px; }
</style>
<body></body>
<script type="module">
import { create, MAX_OCC, TRANSPORT_GROUPS } from '/komorebi.js';
import { VS_FULL, FS_FAITH, GLSL_LAYER_FIELD, GLSL_WOOD_FIELD, GLSL_SKY_RAY } from '/komorebi-shaders.js';
import { PRESETS } from '/presets.js';
import { fillDirections, fillRef, fillTile, texelTap, skyRayRef, texelMix } from '/komorebi-fill.js';
import { atmosphere, ballisticK, sunDirection } from '/komorebi-math.js';

const W = 320, H = 180;           // small on purpose: SwiftShader is a software rasteriser, not a GPU
// The freeze set. Wind is deterministic noise-of-TIME (no RNG), so the only way to get a reproducible frame
// is to stop time advancing at all: no wind force, no weather spell, no auto-drift — then motionActive() is
// false from the first frame and the springs never leave rest. auto_quality has to go too: it trims
// resolution and sample count off wall-clock fps, which under software rendering is pure noise.
const FREEZE = { wind_strength: 0, weather_variability: 0, drift_auto: false, auto_quality: false };

const caps = new Map();           // id -> { w, h, bytes } — kept so __diff compares raw bytes, not re-encoded PNGs
let nextId = 0;

window.__presets = () => Object.keys(PRESETS);

// Preflight on a throwaway context: report what the browser actually gave us, so a missing WebGL2 or a
// missing float-render-target extension is named by the runner instead of surfacing as `create()` threw.
window.__glinfo = () => {
  const c = document.createElement('canvas');
  const gl = c.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) return { webgl2: false };
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const info = {
    webgl2: true,
    colorBufferFloat: !!gl.getExtension('EXT_color_buffer_float'),
    floatBlend: !!gl.getExtension('EXT_float_blend'),
    version: gl.getParameter(gl.VERSION),
    glsl: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
    renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
    maxTexture: gl.getParameter(gl.MAX_TEXTURE_SIZE),
    dpr: window.devicePixelRatio,
  };
  gl.getExtension('WEBGL_lose_context')?.loseContext();
  return info;
};

function fnv1a(bytes) {                       // 32-bit FNV-1a: a cheap identity for the log table (__diff is the real check)
  let h = 0x811c9dc5;
  for (let i = 0; i < bytes.length; i++) h = Math.imul(h ^ bytes[i], 0x01000193);
  return (h >>> 0).toString(16).padStart(8, '0');
}

// Degeneracy stats: a frame that is uniformly black, uniformly white, or flat is a rendered nothing, and a
// hash alone would happily call two of those "identical". Variance is over the RGB bytes of the whole frame.
function stats(bytes) {
  let sum = 0, sumSq = 0, luma = 0, black = 0, white = 0, opaque = true;
  const px = bytes.length / 4;
  for (let i = 0; i < bytes.length; i += 4) {
    const r = bytes[i], g = bytes[i + 1], b = bytes[i + 2];
    sum += r + g + b; sumSq += r * r + g * g + b * b;
    luma += 0.2126 * r + 0.7152 * g + 0.0722 * b;   // Rec.709 — the transition metric reads THIS, not the flat channel mean
    if (r === 0 && g === 0 && b === 0) black++;
    if (r === 255 && g === 255 && b === 255) white++;
    if (bytes[i + 3] !== 255) opaque = false;
  }
  const n = px * 3, mean = sum / n;
  return { mean, luma: luma / px, variance: sumSq / n - mean * mean, blackFrac: black / px, whiteFrac: white / px, opaque };
}

window.__png = (id) => {
  const cap = caps.get(id);
  if (!cap) throw new Error(`no capture ${id}`);
  return encodePNG(cap.bytes, cap.w, cap.h);
};

// readPixels hands back rows bottom-up; a 2-D canvas wants them top-down. Alpha is forced opaque before
// putImageData so the 2-D context's premultiply round-trip cannot perturb the colour bytes (the engine's
// context is alpha:false, so the readback alpha is 255 anyway — stats().opaque asserts that).
function encodePNG(bytes, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) img.data.set(bytes.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
  for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
  ctx.putImageData(img, 0, 0);
  return c.toDataURL('image/png');
}

window.__diff = (idA, idB) => {
  const a = caps.get(idA), b = caps.get(idB);
  if (!a || !b) throw new Error(`no capture ${idA}/${idB}`);
  if (a.w !== b.w || a.h !== b.h) return { equal: false, reason: 'size', a: [a.w, a.h], b: [b.w, b.h] };
  let diffPixels = 0, maxDelta = 0, firstAt = null;
  const mask = new Uint8Array(a.w * a.h);
  for (let p = 0; p < mask.length; p++) {
    const i = p * 4;
    let d = 0;
    for (let k = 0; k < 3; k++) d = Math.max(d, Math.abs(a.bytes[i + k] - b.bytes[i + k]));
    if (d > 0) {
      diffPixels++; mask[p] = Math.min(255, d * 16);
      if (maxDelta < d) maxDelta = d;
      if (!firstAt) firstAt = [p % a.w, a.h - 1 - Math.floor(p / a.w)];   // report in top-down image coords
    }
  }
  if (!diffPixels) return { equal: true, diffPixels: 0, maxDelta: 0 };
  const vis = new Uint8Array(a.bytes.length);                             // 16× amplified magenta-on-grey diff
  for (let p = 0; p < mask.length; p++) {
    const i = p * 4, grey = (a.bytes[i] + a.bytes[i + 1] + a.bytes[i + 2]) / 6;
    vis[i] = mask[p] ? 255 : grey; vis[i + 1] = mask[p] ? 255 - mask[p] : grey;
    vis[i + 2] = mask[p] ? 255 : grey; vis[i + 3] = 255;
  }
  return { equal: false, diffPixels, maxDelta, firstAt, total: mask.length, png: encodePNG(vis, a.w, a.h) };
};

// One engine, one look, captured at each of `frames` (ascending rAF tick counts). The engine is paused and
// disposed before resolving, so twenty-odd of these in a row never hold twenty live GL contexts.
// opts.rebake: re-bake at tick 4 (what the robustness suite does) — a faithful look otherwise captures the first
// bake, made against an empty sun cloud (rebuildAll bakes before regenSource). Off for every suite: their hashes
// are of what the engine shows by itself. opts.size = [w, h]: the canvas in CSS px (the `--look` eyeball mode only —
// a soft artefact such as a mip's facets wants a frame bigger than the 320x180 every hash is taken at).
window.__run = (presetName, overrides, frames, opts) => new Promise((resolve, reject) => {
  const base = PRESETS[presetName];
  if (!base) return reject(new Error(`unknown preset '${presetName}'`));
  for (const k of Object.keys(overrides || {})) {
    if (k in FREEZE) return reject(new Error(`override '${k}' collides with the motion freeze — the run would not be reproducible`));
  }
  const params = Object.assign({}, base, overrides || {}, FREEZE);
  const canvas = document.createElement('canvas');
  canvas.className = 'stage';
  canvas.style.width = `${opts && opts.size ? opts.size[0] : W}px`; canvas.style.height = `${opts && opts.size ? opts.size[1] : H}px`;
  document.body.appendChild(canvas);

  const t0 = performance.now();
  const want = frames.slice();
  const out = [];
  let eng = null, ticks = 0, glError = 0, done = false;
  const finish = (err) => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    // The woody occluder's cap (§4.5) is read BEFORE dispose, while the grove is still standing: `want` is what
    // this grove grew, `count` what the table could hold. They differ silently — a truncated grove renders with
    // its later trees simply having no wood — so the runner is handed both and says so.
    const occ = eng ? { count: eng.occ.count, want: eng.occ.want, cap: MAX_OCC } : null;
    try { eng?.setPaused(true); eng?.dispose(); } catch { /* a disposed/failed engine has nothing to stop */ }
    canvas.remove();
    if (err) reject(err); else resolve({ captures: out, glError, occ, ms: Math.round(performance.now() - t0) });
  };
  const timer = setTimeout(() => finish(new Error(`'${presetName}' did not reach frame ${want[0]} within 120 s`)), 120000);

  try {
    eng = create(canvas, { params });
  } catch (e) { return finish(e); }

  const gl = eng.gl;
  eng.onFrame = () => {
    ticks++;
    if (opts && opts.rebake && ticks === 4) eng.apply('bake');
    if (done || ticks < want[0]) return;
    want.shift();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const w = canvas.width, h = canvas.height;
    const bytes = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    const e = gl.getError();
    if (e !== 0) glError = e;
    const id = `c${nextId++}`;
    caps.set(id, { w, h, bytes });
    out.push({ id, frame: ticks, w, h, hash: fnv1a(bytes), stats: stats(bytes) });
    if (!want.length) finish(null);
  };
});

// ---------------------------------------------------------------------------
// THE SKY FILL, SHADER vs REFERENCE (spec §4.7). komorebi-fill.js holds the quadrature's laws under `bun test`, but a
// law about a JS function says nothing about the GLSL that ships. So: let the engine bake a real fill (frozen motion),
// read back the layer textures it read and the Tsky / S it wrote, rebuild the SAME quantity at sampled texels in JS from
// the readback — bilinear taps through the fill's own domain (REPEAT in the endless park, open sky past the box of a finite
// tree), the layers' own heights, the atmosphere and the BEAM's sun path the bake used — and compare. Level 0 is read (the
// mip the receiver samples is a box average of it, tested by eye and by the gate rows).
// Returns the worst absolute error on each of Tsky and S over the sampled texels, and the scale of each, so the runner
// can say how big the error is against the thing it measures.
//
// opts.energy adds the BOOKKEEPING (§4.7), on the very layers the engine baked, in the units of one fill-frame area:
//   E[L]   what layer L emits, summed over its own texels:  Σ (t − tb)·sun·A_L   (A_L = the beam's sun path through the layers above)
//   Dbeam  what the beam gives up, summed over the floor's columns (the endless park only: its columns are the box, sun path vertical)
//   Reng   what the ENGINE's fill texture holds, Σ S·texel area over the whole fill frame
//   edge / crown  S at the fill frame's outermost ring against its brightest 16-texel block: how far the glow decays before the frame ends
// ---------------------------------------------------------------------------
window.__fillCheck = (presetName, overrides, opts) => new Promise((resolve, reject) => {
  const base = PRESETS[presetName];
  if (!base) return reject(new Error(`unknown preset '${presetName}'`));
  const o = Object.assign({ frames: 24, rebake: false, samples: 96, grid: 331 }, opts || {});
  const params = Object.assign({}, base, overrides || {}, FREEZE);
  const canvas = document.createElement('canvas');
  canvas.className = 'stage'; canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  document.body.appendChild(canvas);
  let eng = null, ticks = 0, done = false;
  const finish = (err, out) => {
    if (done) return; done = true; clearTimeout(timer);
    try { eng?.setPaused(true); eng?.dispose(); } catch { /* nothing to stop */ }
    canvas.remove();
    if (err) reject(err); else resolve(out);
  };
  const timer = setTimeout(() => finish(new Error('fill check did not reach its frame within 120 s')), 120000);
  try { eng = create(canvas, { params }); } catch (e) { return finish(e); }
  const gl = eng.gl;
  const read = (tex, n) => {                           // an RGBA16F texture, level 0, as float32 (EXT_color_buffer_float makes it readable)
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const out = new Float32Array(n * n * 4);
    gl.readPixels(0, 0, n, n, gl.RGBA, gl.FLOAT, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb);
    return out;
  };
  // (the bilinear tap through the fill's domain is komorebi-fill.js texelTap — the reference's own, so the harness cannot read a box differently from the bun tests)
  eng.onFrame = () => {
    ticks++;
    if (o.rebake && ticks === 4) eng.apply('bake');
    if (done || ticks < o.frames) return;
    try {
      const p = eng.params, E = p.canopy_extent_m, fill = eng.fill;
      if (!fill.ready || !fill.tex[0]) return finish(new Error(`the fill never became ready (canopy_fill ${p.canopy_fill})`));
      const faithful = p.faithful_canopy && (p.receiver | 0) !== 2 && !p.sky_view;
      const nL = p.layer_count, lt = eng.layers();
      const lres = faithful ? Math.min(Math.max(p.fill_resolution | 0, 32), 1024) : eng.perf.bres;   // the layers' own size: the faithful set is sized by the fill
      const heights = faithful ? Array.from(eng.faith.binH).slice(0, nL)
        : Array.from({ length: nL }, (_, i) => (nL > 1 ? p.canopy_base_height_m + (i / (nL - 1)) * p.canopy_thickness_m : p.canopy_base_height_m));
      const data = lt.slice(0, nL).map((t) => read(t, lres));
      const canopy = { ox: -E / 2, oy: -E / 2, ext: E };   // the box the layers were baked over
      const bulkOn = !!p.standing_scene || (p.receiver | 0) !== 0;   // a beam with a bulk shift = a finite tree (§4.8); none = the endless park
      const mode = bulkOn ? 'open' : 'wrap';               // the fill's domain: open sky past a tree's box, the box repeating for the park
      const fr = fill.ext ? { ox: fill.ox, oy: fill.oy, ext: fill.ext } : canopy;   // the plan square the fill texture covers (an engine without a fill frame bakes over the box)
      const at4 = (L, x, y) => texelTap(data[L], lres, canopy, mode, x, y);
      const layers = heights.map((h, L) => ({ h, t: (x, y) => at4(L, x, y).slice(0, 3).map((tau) => Math.exp(-tau)), c: (x, y) => at4(L, x, y)[3] }));
      const beamK = ballisticK(p.leaf_diffuse);   // the split (§4.5): above 0 the reference emits t − tb from coverage, with the albedo off
      const atm = atmosphere({ sun: [0, 0, 0], ambient: [0, 0, 0] }, p.sun_elevation_deg, p.sky_turbidity, p.ambient_skylight);
      // ONE SUN PER CAMERA (§4.7): the fill lights its leaves along the BEAM's path — the bulk shift, 0 in the endless park — never along the real sun
      const elB = Math.max(p.sun_elevation_deg, 6) * Math.PI / 180, azB = p.sun_azimuth_deg * Math.PI / 180, cotB = Math.cos(elB) / Math.sin(elB);
      const gS = bulkOn ? [cotB * Math.cos(azB), cotB * Math.sin(azB)] : [0, 0];
      const floorCam = (p.receiver | 0) === 0 && !p.sky_view;
      const n = fill.res, K = Math.min(Math.max(p.fill_directions | 0, 1), 64);
      const T = read(fill.tex[0], n), S = read(fill.tex[1], n);
      let eT = 0, eS = 0, sT = 0, sS = 0, minT = 1, maxT = 0, maxS = 0, k = 0;
      for (let q = 0; q < o.samples; q++) {              // a fixed scatter of texels, interior and border alike
        const u0 = (q * 0.6180339887) % 1, v0 = (q * 0.7548776662 + 0.3) % 1;
        const box = q % 2 === 1 && fr.ext > E;                // a finite tree's frame is mostly empty floor: every other sample is drawn from the canopy box instead
        const i = Math.min(n - 1, Math.floor((box ? ((canopy.ox - fr.ox) + u0 * E) / fr.ext : u0) * n)), j = Math.min(n - 1, Math.floor((box ? ((canopy.oy - fr.oy) + v0 * E) / fr.ext : v0) * n));
        const x = [fr.ox + ((i + 0.5) / n) * fr.ext, fr.oy + ((j + 0.5) / n) * fr.ext];
        const ref = fillRef(layers, x, K, { gS, sun: atm.sun, scatter: floorCam ? p.fill_scatter : 0, tile: fillTile(i, j), k: beamK });   // the proxy's albedo is the floor's alone (the cloth and the tent are handed 0) and is off above k = 0; each texel carries its own slot of the 4x4 interleaving tile
        for (let c = 0; c < 3; c++) {
          const gT = T[(j * n + i) * 4 + c], gSv = S[(j * n + i) * 4 + c];
          eT = Math.max(eT, Math.abs(gT - ref.T[c])); eS = Math.max(eS, Math.abs(gSv - ref.S[c]));
          sT += ref.T[c]; sS += ref.S[c]; k++;
          minT = Math.min(minT, gT); maxT = Math.max(maxT, gT); maxS = Math.max(maxS, gSv);
        }
      }
      // how rough is Tsky (green) at TEXEL scale, and what the mip's box average does to it: the RMS difference between
      // neighbouring texels at mip levels 0..3 (a 2x2 box each step, the very chain generateMipmap builds). The receiver
      // reads one of these levels; this is the evidence for which (komorebi-transport.js, FILL_LOD).
      let lvl = Float32Array.from({ length: n * n }, (_, i) => T[i * 4 + 1]), m = n;
      const rough = [];
      for (let L = 0; L < 4 && m > 2; L++) {
        let ss = 0, cc = 0;
        for (let y = 0; y < m; y++) for (let x = 0; x < m - 1; x++) { const d = lvl[y * m + x + 1] - lvl[y * m + x]; ss += d * d; cc++; }
        rough.push(Math.sqrt(ss / cc));
        const nx = new Float32Array((m / 2) * (m / 2));
        for (let y = 0; y < m / 2; y++) for (let x = 0; x < m / 2; x++) nx[y * (m / 2) + x] = (lvl[2 * y * m + 2 * x] + lvl[2 * y * m + 2 * x + 1] + lvl[(2 * y + 1) * m + 2 * x] + lvl[(2 * y + 1) * m + 2 * x + 1]) / 4;
        lvl = nx; m /= 2;
      }
      let energy = null;
      if (o.energy) {
        // Every quantity here is the INTEGRAL of what the engine reads: the layer taps interpolate optical depth and coverage bilinearly and
        // only then apply the exponential, so an emission read between two texels is not the average of the two texels' emissions (a leaf's edge
        // texel holds depth AND coverage, and half of each is far more light than half of the light) — summing texel values would not be
        // the field the fill integrates. The emitters are a G×G midpoint grid over the canopy box, read through the same domain as the bake.
        // the rays are the ones the ENGINE's texels together hold: each of the 16 tile slots has its own rotation of the K, so a floor point's
        // neighbourhood sees 16·K distinct directions, and the far tail of the hemisphere (where a ray leaves the frame) is only in the union
        const sun = atm.sun, G = o.grid, cell = E / G, w = cell * cell, dirs = [];
        for (let b = 0; b < 16; b++) for (const d of fillDirections(K, b)) dirs.push(d.shift);
        const K2 = dirs.length;
        const per = Array.from({ length: nL }, () => [0, 0, 0]), Dbeam = [0, 0, 0], Ropen = [0, 0, 0], Rin = [0, 0, 0];
        const inFrame = (x, y) => x >= fr.ox && x <= fr.ox + fr.ext && y >= fr.oy && y <= fr.oy + fr.ext;
        for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
          const px = canopy.ox + (i + 0.5) * cell, py = canopy.oy + (j + 0.5) * cell;
          if (!bulkOn && beamK > 0) {                                 // the park's columns ARE the box and its sun path is vertical: the beam's deficit at a column is Π t − Π tb
            const Pt = [1, 1, 1], Pb = [1, 1, 1];
            for (let L = 0; L < nL; L++) { const r = at4(L, px, py), m = texelMix(r, r[3], beamK); for (let c = 0; c < 3; c++) { Pt[c] *= m.T[c]; Pb[c] *= m.Tb[c]; } }   // every texel a mixture of leaf and gap (§4.5), through the engine's own interpolation
            for (let c = 0; c < 3; c++) Dbeam[c] += (Pt[c] - Pb[c]) * sun[c] * w;
          }
          for (let L = 0; L < nL; L++) {
            const q = at4(L, px, py);
            if (!(q[3] > 0) || !(beamK > 0)) continue;
            const mq = texelMix(q, q[3], beamK), A = [1, 1, 1];   // the sun's ballistic path to this leaf: the layers above it, read along the beam's g
            for (let M = L + 1; M < nL; M++) {
              const d = heights[M] - heights[L], r = at4(M, px + gS[0] * d, py + gS[1] * d), mr = texelMix(r, r[3], beamK);
              for (let c = 0; c < 3; c++) A[c] *= mr.Tb[c];
            }
            const Mv = [0, 1, 2].map((c) => (mq.T[c] - mq.Tb[c]) * sun[c] * A[c]);   // emit = T − Tb: the gap emits nothing
            for (let c = 0; c < 3; c++) per[L][c] += Mv[c] * w;
            for (const s of dirs) {                                   // what reaches the floor: down ray k through the layers below on their TRUE T, landing at p − s·h_L
              const thr = [1, 1, 1];
              for (let M = 0; M < L; M++) { const r = at4(M, px - s[0] * (heights[L] - heights[M]), py - s[1] * (heights[L] - heights[M])), mr = texelMix(r, r[3], beamK); for (let c = 0; c < 3; c++) thr[c] *= mr.T[c]; }
              const inside = !bulkOn || inFrame(px - s[0] * heights[L], py - s[1] * heights[L]);   // the endless park lands every ray (the box repeats)
              for (let c = 0; c < 3; c++) { const v = Mv[c] * thr[c] * w / K2; Ropen[c] += v; if (inside) Rin[c] += v; }
            }
          }
        }
        const areaF = (fr.ext / n) ** 2, Reng = [0, 0, 0], g = new Float64Array(n * n);
        for (let i = 0; i < n * n; i++) { for (let c = 0; c < 3; c++) Reng[c] += S[i * 4 + c] * areaF; g[i] = S[i * 4 + 1]; }

// the readback gives (texelMix at k, Tb). Band = the soft edge, 0.05 ≤ c ≤ 0.95 by the readback's own coverage. `slab` is the answer the old read gave
// (e^(−τ − k·c)), kept as the measured size of what the mixture removes: the ratio of its mean to the mixture's in the band is the halo's depth.
// The diffraction read is checked at a dispersed position, where the bilinear weights are real.
window.__haloCheck = (presetName, overrides, opts) => withEngine(presetName, overrides, 24, (eng, gl) => {
  const o = Object.assign({ crop: 384, H: 5, gx: 0.013, gy: -0.007, cs: [1.03, 1.0, 0.97] }, opts || {});
  const p = eng.params, E = p.canopy_extent_m, nL = p.layer_count, n = eng.perf.bres, k = ballisticK(p.leaf_diffuse);
  if (!(k > 0)) throw new Error('the halo is a leaf_diffuse > 0 effect: nothing to measure at 0');
  const lt = eng.layers(), dat = lt.slice(0, nL).map((t) => readLayer(gl, t, n)), ox = -E / 2, texel = E / n;
  const crop = Math.min(o.crop, n), i0 = Math.floor((n - crop) / 2), canopy = { ox, oy: ox, ext: E };
  const fs = `#version 300 es
precision highp float;
layout(location=0) out vec4 oTap;
layout(location=1) out vec4 oCA;
${GLSL_LAYER_FIELD}
${TRANSPORT_GROUPS.tap.decls}
${TRANSPORT_GROUPS.ca.decls}
uniform vec2 uCrop0, uG;
uniform float uTexel, uH;
uniform int uWhich;
void main(){
  vec2 p = uCrop0 + gl_FragCoord.xy*uTexel;
  vec3 a = vec3(1.0), b = vec3(1.0);
  if(uWhich == 0){ a = tap(uLayer[0], p); b = tapCA(uLayer[0], p, uG, uH, uChroma); }
  else if(uWhich == 1){ a = tap(uLayer[1], p); b = tapCA(uLayer[1], p, uG, uH, uChroma); }
  else if(uWhich == 2){ a = tap(uLayer[2], p); b = tapCA(uLayer[2], p, uG, uH, uChroma); }
  else { a = tap(uLayer[3], p); b = tapCA(uLayer[3], p, uG, uH, uChroma); }
  oTap = vec4(a, 1.0); oCA = vec4(b, 1.0);
}`;
  const lum = (v) => 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  const res = { k, n, crop, errTap: 0, errCA: 0, band: 0, bandMix: 0, bandSlab: 0, bandShader: 0, worstRatio: 1, darkest: 1, nBand: 0, byLayer: [], glError: 0 };
  for (let L = 0; L < nL; L++) {
    const { out, glError } = probe(gl, { fs, w: crop, h: crop, targets: 2, setup: (prog, U) => {
      gl.uniform2f(U('uCanopyOrigin'), ox, ox); gl.uniform2f(U('uCanopyExtent'), E, E);
      gl.uniform3f(U('uSunColor'), 1, 1, 1); gl.uniform3f(U('uAmbient'), 1, 1, 1);
      gl.uniform1fv(U('uLayerHeight[0]'), [0, 0, 0, 0]); gl.uniform1i(U('uLayerCount'), nL); gl.uniform1f(U('uBeamK'), k);
      gl.uniform2f(U('uCrop0'), ox + i0 * texel, ox + i0 * texel); gl.uniform1f(U('uTexel'), texel);
      gl.uniform2f(U('uG'), o.gx, o.gy); gl.uniform1f(U('uH'), o.H); gl.uniform3f(U('uChroma'), o.cs[0], o.cs[1], o.cs[2]); gl.uniform1i(U('uWhich'), L);
      for (let i = 0; i < 4; i++) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, lt[i]); gl.uniform1i(U(`uLayer[${i}]`), i); }
    } });
    if (glError) res.glError = glError;
    let nb = 0, mixSum = 0, slabSum = 0, shSum = 0, worst = 1, e1 = 0, e2 = 0;
    for (let cj = 0; cj < crop; cj++) for (let ci = 0; ci < crop; ci++) {
      const idx = (i0 + cj) * n + (i0 + ci), tex = dat[L].subarray(idx * 4, idx * 4 + 4), c = tex[3];
      const m = texelMix(tex, c, k), got = out[0].subarray((cj * crop + ci) * 4, (cj * crop + ci) * 4 + 3);
      for (let ch = 0; ch < 3; ch++) e1 = Math.max(e1, Math.abs(got[ch] - m.Tb[ch]));
      // the dispersed read: each channel's own bilinear tap at its own position, through the very interpolation the GPU does (clamped box)
      const x = ox + (i0 + ci + 0.5) * texel, y = ox + (i0 + cj + 0.5) * texel, ca = out[1].subarray((cj * crop + ci) * 4, (cj * crop + ci) * 4 + 3);
      for (let ch = 0; ch < 3; ch++) {
        const q = texelTap(dat[L], n, canopy, 'clamp', x + o.H * o.gx * o.cs[ch], y + o.H * o.gy * o.cs[ch]);
        e2 = Math.max(e2, Math.abs(ca[ch] - texelMix(q, q[3], k).Tb[ch]));
      }
      if (c >= 0.05 && c <= 0.95) {
        nb++; mixSum += lum(m.Tb); shSum += lum(got);
        slabSum += lum([0, 1, 2].map((ch) => Math.exp(-tex[ch] - k * c)));
        worst = Math.min(worst, lum(got) / lum(m.Tb));
      }
    }
    res.byLayer.push({ L, nBand: nb, shader: shSum / Math.max(nb, 1), mix: mixSum / Math.max(nb, 1), slab: slabSum / Math.max(nb, 1) });
    res.errTap = Math.max(res.errTap, e1); res.errCA = Math.max(res.errCA, e2);
    res.nBand += nb; res.bandMix += mixSum; res.bandSlab += slabSum; res.bandShader += shSum; res.worstRatio = Math.min(res.worstRatio, worst);
  }
  res.shaderOverMix = res.bandShader / Math.max(res.bandMix, 1e-12); res.slabOverMix = res.bandSlab / Math.max(res.bandMix, 1e-12);
  return res;
});

// THE FAITHFUL STAMP'S EDGE BAND (§4.5). FS_FAITH draws ONE leaf per quad into the multiplicative scratch; at leaf_diffuse > 0 its pixel is the leaf's mixture,
// (1 − cf) + cf·e^(−τ_leaf − k) with cf = cov·fade, where it used to be e^(−(τ + k·fade)·cov): a dark halo ring round every faithful leaf (0.18 against 0.70
// at cov 0.3 in blue). This compiles FS_FAITH as the engine ships it behind a trivial vertex shader (vLocal over [-1.2, 1.2]², vTau and vFade constants), draws
// one leaf, and holds every pixel to the mixture computed here from the mask's own formula. The leaf is the grove's: vTau is τ_leaf·fade (the fade folded in)
// and vFade the fade, so three fades are drawn — whole, half, and one too faint to exist (cov·fade < 1e-4: exactly clear, and finite: vTau/vFade is never formed).
window.__stampCheck = (opts) => withEngine('memories', {}, 2, (eng, gl) => {
  const edge = (opts && opts.edge) || 0.26, k = ballisticK((opts && opts.d) ?? 0.95), W2 = 241;
  const tauLeaf = [1.35, 0.69, 1.83];
  const vs = `#version 300 es
precision highp float;
out vec2 vLocal; out vec3 vTau; out float vFade;
uniform vec3 uTau; uniform float uFade;
void main(){
  vec2 p = vec2((gl_VertexID==1)?3.0:-1.0, (gl_VertexID==2)?3.0:-1.0);
  vLocal = p*1.2; vTau = uTau; vFade = uFade;
  gl_Position = vec4(p, 0.0, 1.0);
}`;
  const smooth = (e0, e1, x) => { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); };
  const cases = [{ name: 'fade 1', fade: 1 }, { name: 'fade 0.5', fade: 0.5 }, { name: 'fade 3e-5 (not there yet)', fade: 3e-5 }];
  const rows = [];
  for (const cs of cases) {
    const { out, glError } = probe(gl, { vs, fs: FS_FAITH, w: W2, h: W2, clear: -7, setup: (prog, U) => {
      gl.uniform1f(U('uEdge'), edge); gl.uniform1f(U('uBeamK'), k);
      gl.uniform3f(U('uTau'), tauLeaf[0] * cs.fade, tauLeaf[1] * cs.fade, tauLeaf[2] * cs.fade); gl.uniform1f(U('uFade'), cs.fade);
    } });
    let err = 0, nBand = 0, nIn = 0, nOut = 0, bandMin = [9, 9, 9], bandMean = [0, 0, 0], slabMean = [0, 0, 0], mixMean = [0, 0, 0], finite = true;
    for (let j = 0; j < W2; j++) for (let i = 0; i < W2; i++) {
      const x = ((i + 0.5) / W2 * 2 - 1) * 1.2, y = ((j + 0.5) / W2 * 2 - 1) * 1.2, r = Math.hypot(x, y), cov = 1 - smooth(1 - edge, 1, r), px = out[0].subarray((j * W2 + i) * 4, (j * W2 + i) * 4 + 3);
      if (!px.every(Number.isFinite)) finite = false;
      if (!(cov > 0)) { if (px[0] !== -7) err = Math.max(err, 1); nOut++; continue; }   // discarded: the sentinel is still there
      const cf = cov * cs.fade, want = tauLeaf.map((t) => (cf < 1e-4 ? 1 : (1 - cf) + cf * Math.exp(-t - k)));
      for (let ch = 0; ch < 3; ch++) err = Math.max(err, Math.abs(px[ch] - want[ch]));
      nIn++;
      if (cov >= 0.05 && cov <= 0.95 && cs.fade === 1) {
        nBand++;
        for (let ch = 0; ch < 3; ch++) { bandMin[ch] = Math.min(bandMin[ch], px[ch] / want[ch]); bandMean[ch] += px[ch]; mixMean[ch] += want[ch]; slabMean[ch] += Math.exp(-(tauLeaf[ch] + k * cs.fade) * cov); }
      }
    }
    rows.push({ name: cs.name, err, nBand, nIn, nOut, finite, glError, bandOverMix: bandMean.map((v, ch) => v / Math.max(mixMean[ch], 1e-12)), slabOverMix: slabMean.map((v, ch) => v / Math.max(mixMean[ch], 1e-12)) });
  }
  return { k, edge, rows };
});

// ---------------------------------------------------------------------------
// THE SKY FILL, OPENED AND SHUT ON A RUNNING ENGINE (§4.7). canopy_fill is a MORPH key: it tweens, so it crosses 0 in the
// middle of a transition or a slider drag, and nothing rebuilds when it does. The fill therefore allocates lazily on the
// first draw that wants it (on the faithful path, a low-res layer set with it) and frees on the first that does not.
// This runs that crossing: a frame with the gate shut, a frame with it open, a frame shut again — and reports what was
// allocated at each, so "shut costs nothing", "open really bakes" and "shut again is the old frame, byte for byte" are
// each a measurement. The sky view must stay unallocated throughout: it has no surface to light.
// ---------------------------------------------------------------------------
window.__fillToggle = (presetName, overrides, opts) => new Promise((resolve, reject) => {
  const base = PRESETS[presetName];
  if (!base) return reject(new Error(`unknown preset '${presetName}'`));
  const o = Object.assign({ rebake: false }, opts || {});
  const params = Object.assign({}, base, overrides || {}, { canopy_fill: 0 }, FREEZE);
  const canvas = document.createElement('canvas');
  canvas.className = 'stage'; canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  document.body.appendChild(canvas);
  let eng = null, ticks = 0, done = false, glError = 0;
  const stages = [];
  const finish = (err) => {
    if (done) return; done = true; clearTimeout(timer);
    try { eng?.setPaused(true); eng?.dispose(); } catch { /* nothing to stop */ }
    canvas.remove();
    if (err) reject(err);
    else resolve({ stages, glError, diff: { openVsShut0: window.__diff(stages[0].id, stages[1].id), shutAgain: window.__diff(stages[0].id, stages[2].id) } });
  };
  const timer = setTimeout(() => finish(new Error('fill toggle did not finish within 120 s')), 120000);
  try { eng = create(canvas, { params }); } catch (e) { return finish(e); }
  const gl = eng.gl;
  const grab = (label) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const w = canvas.width, h = canvas.height, bytes = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    const e = gl.getError(); if (e) glError = e;
    const id = `c${nextId++}`;
    caps.set(id, { w, h, bytes });
    stages.push({ label, id, hash: fnv1a(bytes), allocated: !!eng.fill.tex[0], ready: eng.fill.ready });
  };
  eng.onFrame = () => {
    ticks++;
    if (o.rebake && ticks === 4) eng.apply('bake');
    if (done) return;
    if (ticks === 14) grab('shut');
    if (ticks === 15) eng.params.canopy_fill = 1;
    if (ticks === 36) { grab('open'); eng.params.canopy_fill = 0; }
    if (ticks === 58) { grab('shut again'); finish(null); }
  };
});

// ---------------------------------------------------------------------------
// A KNOB MOVED ON A RUNNING ENGINE (§4.5). leaf_diffuse is a MORPH key: it tweens, so in a transition or under a slider it changes
// every frame and NOTHING rebuilds — no apply(), no setParams. Whatever depends on it has to notice by itself: the layer tap reads it as
// a uniform, the fill's signature carries it so S re-bakes, and the faithful cast (which has it baked in) re-casts. This engine is
// born without the change, settles, takes it at tick 15 with a bare assignment, and the frame at tick 36 is returned for the runner to
// hold against an engine born with the knob already set (and against one where it never moved).
// ---------------------------------------------------------------------------
window.__liveChange = (presetName, overrides, key, value, opts) => new Promise((resolve, reject) => {
  const base = PRESETS[presetName];
  if (!base) return reject(new Error(`unknown preset '${presetName}'`));
  const o = Object.assign({ rebake: false }, opts || {});
  const params = Object.assign({}, base, overrides || {}, FREEZE);
  const canvas = document.createElement('canvas');
  canvas.className = 'stage'; canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  document.body.appendChild(canvas);
  let eng = null, ticks = 0, done = false, glError = 0, capture = null;
  const finish = (err) => {
    if (done) return; done = true; clearTimeout(timer);
    try { eng?.setPaused(true); eng?.dispose(); } catch { /* nothing to stop */ }
    canvas.remove();
    if (err) reject(err); else resolve({ capture, glError });
  };
  const timer = setTimeout(() => finish(new Error('live change did not finish within 120 s')), 120000);
  try { eng = create(canvas, { params }); } catch (e) { return finish(e); }
  const gl = eng.gl;
  eng.onFrame = () => {
    ticks++;
    if (o.rebake && ticks === 4) eng.apply('bake');
    if (done) return;
    if (ticks === 15) eng.params[key] = value;
    if (ticks < 36) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const w = canvas.width, h = canvas.height, bytes = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    const e = gl.getError(); if (e) glError = e;
    const id = `c${nextId++}`;
    caps.set(id, { w, h, bytes });
    capture = { id, hash: fnv1a(bytes) };
    finish(null);
  };
});

// ---------------------------------------------------------------------------
// A TRANSITION, WATCHED (spec §9). Everything above this line is byte-stable by construction — motion frozen,
// same bytes every run. This is not, and cannot be: a transition's whole point MOVES, and the bloom rides the
// same clock the wind does, so two runs of the same route differ pixel for pixel. What is stable enough to
// judge is the SHAPE of the mean luminance over the transition — so the metric below is statistical (per-frame
// luma, and the largest frame-to-frame step in it) and the strip is for eyes.
//
// auto_quality is the ONE thing still forced off, at both ends: it is a runtime governor rather than part of
// the look, and under a software rasteriser it would trim resolution mid-transition and land in the table as a
// luminance step that has nothing to do with the transition being measured.
//
// The engine bypasses its adaptive frame-rate saver while trans.active, so every frame here is a real render
// and every capture is a distinct one.
// ---------------------------------------------------------------------------
// STRUCTURAL CHURN: the mean per-pixel grayscale change between consecutive frames. The luminance series above
// is blind to REORGANIZATION — a frame that swaps every dapple for a different dapple of the same brightness
// moves the mean not at all, and that is exactly what a midpoint grove swap does. This sees it: a dissolve that
// keeps the arrangement and only softens it churns a little, and a cut churns enormously. Live wind churns too,
// which is the point of baselining it on a route that only morphs — that natural churn is the standard a
// structural change has to stay near.
function churn(prev, bytes) {
  if (!prev) return 0;
  let acc = 0;
  const px = bytes.length / 4;
  for (let i = 0; i < bytes.length; i += 4) {
    const a = (prev[i] + prev[i + 1] + prev[i + 2]) / 3, b = (bytes[i] + bytes[i + 1] + bytes[i + 2]) / 3;
    acc += Math.abs(a - b);
  }
  return acc / px;
}

window.__transition = (fromName, toName, opts) => new Promise((resolve, reject) => {
  const o = Object.assign({ duration: 1.5, warm: 12, tail: 6, cap: 200 }, opts || {});
  const A = PRESETS[fromName], B = PRESETS[toName];
  if (!A) return reject(new Error(`unknown preset '${fromName}'`));
  if (!B) return reject(new Error(`unknown preset '${toName}'`));
  const NO_AUTO = { auto_quality: false };
  const canvas = document.createElement('canvas');
  canvas.className = 'stage';
  canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  document.body.appendChild(canvas);

  const t0 = performance.now();
  const out = [];
  let eng = null, ticks = 0, started = false, endedAt = -1, done = false, prev = null;
  const finish = (err) => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    const info = eng ? { structDiff: eng.trans.structDiff, canopyMorph: eng.trans.canopyMorph } : null;
    try { eng?.setPaused(true); eng?.dispose(); } catch { /* a disposed/failed engine has nothing to stop */ }
    canvas.remove();
    if (err) reject(err); else resolve({ frames: out, info, ms: Math.round(performance.now() - t0) });
  };
  const timer = setTimeout(() => finish(new Error(`'${fromName}' -> '${toName}' did not finish within 240 s`)), 240000);

  try { eng = create(canvas, { params: Object.assign({}, A, NO_AUTO) }); }
  catch (e) { return finish(e); }

  const gl = eng.gl;
  eng.onFrame = () => {
    ticks++;
    if (done) return;
    if (!started) {                                  // let the bake warm and the springs settle on look A first
      if (ticks < o.warm) return;
      started = true;
      eng.transitionTo(Object.assign({}, B, NO_AUTO), { duration: o.duration });
      return;                                        // the transition's first tick is the next frame
    }
    const w = canvas.width, h = canvas.height;
    const bytes = new Uint8Array(w * h * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    const id = `c${nextId++}`;
    caps.set(id, { w, h, bytes });
    const s = stats(bytes);
    // trans.* is read AFTER the frame drew, so each row is the state that frame was rendered with — which is
    // what makes "the swap landed on the frame where bloom was X" a claim about the picture and not about the clock.
    out.push({ id, t: eng.trans.t, bloom: eng.trans.bloom, swapped: eng.trans.swapped,
               active: eng.trans.active, luma: s.luma, variance: s.variance, churn: churn(prev, bytes) });
    prev = bytes;
    if (!eng.trans.active) {
      if (endedAt < 0) endedAt = out.length;
      if (out.length - endedAt >= o.tail) return finish(null);
    }
    if (out.length >= o.cap) finish(null);
  };
});

// A TRANSITION ROUTE, DRIVEN TO COMPLETION (spec §9) — the smoke half of the transition story, and unlike
// __transition above it IS part of the default run. No pixels and no metrics: a transition isn't byte-stable
// by design, but its ROUTING is pure logic — transitionTo classifies the diff into a tier (live morph /
// grove crossfade / dissolve / mode flip) and each tier drives different code (the crossfade grows a second
// grove via buildTargetGrove; the mode flip swaps the camera). This drives one route on a frozen-motion
// engine and reports what the engine claims about it (trans.crossfade / structDiff / canopyMorph), whether
// onEnd actually fired, and a clean gl.getError() — so a crash or a mis-routed tier on any of these paths
// fails here instead of only in a hand-run `--transition`. FREEZE is merged over BOTH ends so the route's
// own diff is exactly `over` (wind knobs never leak in as an accidental second diff).
// opts.interrupt = { at, with }: once t reaches `at`, call eng.setParams(PRESETS[with]) — the hard param
// swap MUST abort the transition cleanly (a mid-crossfade swap once left the incoming grove baking against
// replaced layer state), and the engine must keep rendering; the run then reports interrupted:true.
window.__transitionSmoke = (fromName, toName, over, opts) => new Promise((resolve, reject) => {
  const o = Object.assign({ duration: 0.3, warm: 8, cap: 600 }, opts || {});
  const A = PRESETS[fromName], B = PRESETS[toName];
  if (!A) return reject(new Error(`unknown preset '${fromName}'`));
  if (!B) return reject(new Error(`unknown preset '${toName}'`));
  const canvas = document.createElement('canvas');
  canvas.className = 'stage';
  canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  document.body.appendChild(canvas);

  const t0 = performance.now();
  let eng = null, ticks = 0, started = false, onEndFired = false, route = null, done = false;
  let interrupted = false, tailLeft = -1;
  const finish = (err) => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    const glError = eng ? eng.gl.getError() : 0;
    try { eng?.setPaused(true); eng?.dispose(); } catch { /* a disposed/failed engine has nothing to stop */ }
    canvas.remove();
    if (err) reject(err);
    else resolve({ ...route, onEndFired, interrupted, glError, ticks, ms: Math.round(performance.now() - t0) });
  };
  const timer = setTimeout(() => finish(new Error(`route did not finish within 120 s (tick ${ticks})`)), 120000);

  try { eng = create(canvas, { params: Object.assign({}, A, FREEZE) }); }
  catch (e) { return finish(e); }

  eng.onFrame = () => {
    if (done) return;
    ticks++;
    try {
      if (!started) {
        if (ticks < o.warm) return;
        started = true;
        eng.transitionTo(Object.assign({}, B, over || {}, FREEZE), { duration: o.duration, onEnd: () => { onEndFired = true; } });
        // trans.* is set synchronously by transitionTo — read the routing verdict now, before it runs
        route = { crossfade: eng.trans.crossfade, structDiff: eng.trans.structDiff, canopyMorph: eng.trans.canopyMorph };
        return;
      }
      if (o.interrupt && !interrupted && eng.trans.t >= o.interrupt.at) {
        interrupted = true;
        eng.setParams(Object.assign({}, PRESETS[o.interrupt.with], FREEZE));
        tailLeft = 10;                             // the abort must leave a live, cleanly rendering engine
        return;
      }
      if (tailLeft > 0 && --tailLeft === 0) return finish(null);
      if (tailLeft < 0 && !eng.trans.active) return finish(null);
      if (ticks >= o.cap) finish(new Error(`transition still active after ${o.cap} ticks`));
    } catch (e) { finish(e); }
  };
});

// ---------------------------------------------------------------------------
// HOST FAILURE POLICY: a throwing onFrame must not freeze the canvas. The engine keeps animating and the
// error still surfaces (window 'error'), so the host sees its own bug. The three frame-loop exits (plain,
// adaptive-skip, adaptive-heavy) each reschedule on their own, so each is driven separately.
// ---------------------------------------------------------------------------
window.__onFrameThrows = (presetName, overrides, want) => new Promise((resolve, reject) => {
  const MARK = 'komorebi-test-onFrame';
  const canvas = document.createElement('canvas');
  canvas.className = 'stage';
  document.body.appendChild(canvas);
  let calls = 0, surfaced = 0, done = false;
  const onErr = (e) => { if (String(e.message).includes(MARK)) { surfaced++; e.preventDefault(); } };
  window.addEventListener('error', onErr);
  let eng = null;
  const finish = (err) => {
    if (done) return;
    done = true;
    clearTimeout(timer); clearInterval(poll);
    window.removeEventListener('error', onErr);
    try { eng?.setPaused(true); eng?.dispose(); } catch { /* nothing to stop */ }
    canvas.remove();
    if (err) reject(err); else resolve({ calls, surfaced });
  };
  const timer = setTimeout(() => finish(null), 20000);   // frames stalled: report what we saw
  try { eng = create(canvas, { params: Object.assign({}, PRESETS[presetName], overrides || {}, FREEZE),
                               onFrame: () => { calls++; throw new Error(MARK); } }); }
  catch (e) { return finish(e); }
  const poll = setInterval(() => { if (calls >= want) setTimeout(() => finish(null), 50); }, 20);
});

// ---------------------------------------------------------------------------
// CONTEXT LOSS (automatic recovery). A look is rendered, the context is lost and restored with
// WEBGL_lose_context, and the frame afterwards must be the frame before: same bytes under frozen motion,
// GL-clean, ONE loop (onFrame calls per rAF tick do not double), and paused state honoured across the gap.
// opts: pause (lose+restore while paused), retarget (setParams to another look first — the recovery must
// rebuild from the CURRENT params, not the create-time ones), transition (lose mid-transition), over (param
// overrides over the look: the sky fill's GL objects only exist when a look opens it).
// ---------------------------------------------------------------------------
window.__contextLoss = async (presetName, opts) => {
  const o = Object.assign({ pause: false, retarget: null, transition: null, over: null }, opts || {});
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const withTimeout = (p, ms, what) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(`timed out waiting for ${what}`)), ms))]);
  const canvas = document.createElement('canvas');
  canvas.className = 'stage';
  canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  document.body.appendChild(canvas);

  let ticks = 0, waiter = null;
  const grab = (gl) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const w = canvas.width, h = canvas.height, bytes = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    const glError = gl.getError();
    const id = `c${nextId++}`;
    caps.set(id, { w, h, bytes });
    return { id, glError, stats: stats(bytes) };
  };
  // resolves from INSIDE onFrame (the drawing buffer is only readable there), n ticks from now
  const capture = (n) => new Promise((res) => { waiter = { left: n, res }; });
  const params = Object.assign({}, PRESETS[presetName], o.over || {}, FREEZE);
  const eng = create(canvas, { params });
  const gl = eng.gl;
  eng.onFrame = () => {
    ticks++;
    if (waiter && --waiter.left <= 0) { const w = waiter; waiter = null; w.res(grab(gl)); }
  };
  const lose = gl.getExtension('WEBGL_lose_context');
  const events = [];
  let lostPrevented = null;
  canvas.addEventListener('webglcontextlost', (e) => { lostPrevented = e.defaultPrevented; events.push('lost'); });   // registered after the engine's, so defaultPrevented reflects its handler
  canvas.addEventListener('webglcontextrestored', () => events.push('restored'));
  const waitEvent = (name) => new Promise((res) => canvas.addEventListener(name, res, { once: true }));
  // rAF ticks vs onFrame calls over a window: a second loop shows up as ~2 calls per rAF
  const rate = (rafs) => new Promise((res) => {
    const t0 = ticks; let n = 0;
    const step = () => { if (++n >= rafs) res({ calls: ticks - t0, rafs }); else requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  const out = {};
  try {
    await withTimeout(capture(8), 60000, 'warm-up frames');
    // rebuildAll() bakes BEFORE regenSource(), so with motion frozen the faithful path's first frame stays baked against an
    // empty sun cloud (nothing re-bakes it). Settle that here, so the pre-loss frame is the real look and the comparison means something.
    eng.apply('bake');
    if (o.retarget) eng.setParams(Object.assign({}, PRESETS[o.retarget], FREEZE));
    if (o.transition) eng.transitionTo(Object.assign({}, PRESETS[presetName], { seed: 1234567 }, FREEZE), { duration: 0.6 });
    out.before = await withTimeout(capture(12), 60000, 'pre-loss capture');
    out.rateBefore = await rate(30);
    if (o.pause) eng.setPaused(true);

    const lostP = waitEvent('webglcontextlost');
    lose.loseContext();
    await withTimeout(lostP, 5000, 'webglcontextlost');
    out.lostPrevented = lostPrevented;
    out.isLost = gl.isContextLost();
    const t0 = ticks;
    await rate(8);
    out.ticksWhileLost = ticks - t0;

    const restoredP = waitEvent('webglcontextrestored');
    lose.restoreContext();
    await withTimeout(restoredP, 10000, 'webglcontextrestored');
    out.isLostAfter = gl.isContextLost();
    if (o.pause) {
      const t1 = ticks;
      await rate(8);
      out.ticksWhilePaused = ticks - t1;
      eng.setPaused(false);
    }
    if (o.transition) { while (eng.trans.active) await withTimeout(capture(1), 60000, 'transition end'); }   // the route must still be finishable (or already aborted)
    out.after = await withTimeout(capture(o.transition ? 12 : 4), 60000, 'post-restore capture');
    out.rateAfter = await rate(30);
    out.glErrorEnd = gl.getError();
    out.events = events.slice();
    if (!o.transition) out.diff = window.__diff(out.before.id, out.after.id);
  } finally {
    try { eng.setPaused(true); eng.dispose(); } catch { /* a disposed/failed engine has nothing to stop */ }
    canvas.remove();
  }
  return out;
};

// dispose() deliberately loses the context: it must NOT be treated as a loss to recover from (no
// preventDefault, no restore, no frames), and every listener the engine added must be gone.
window.__disposeNoRecovery = async () => {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const canvas = document.createElement('canvas');
  canvas.className = 'stage';
  document.body.appendChild(canvas);
  const added = [], removed = [];
  const add = canvas.addEventListener.bind(canvas), rem = canvas.removeEventListener.bind(canvas);
  canvas.addEventListener = (t, f, ...r) => { added.push([t, f]); return add(t, f, ...r); };
  canvas.removeEventListener = (t, f, ...r) => { removed.push([t, f]); return rem(t, f, ...r); };
  let ticks = 0;
  const eng = create(canvas, { params: Object.assign({}, PRESETS['park 1'], FREEZE), onFrame: () => { ticks++; } });
  const gl = eng.gl;
  const ctxListeners = added.filter(([t]) => t.startsWith('webglcontext'));
  const lost = new Promise((res) => add('webglcontextlost', res, { once: true }));
  let restored = false, prevented = null;
  add('webglcontextrestored', () => { restored = true; });
  while (ticks < 3) await sleep(20);
  eng.dispose();
  const ev = await Promise.race([lost, sleep(3000).then(() => null)]);
  prevented = ev ? ev.defaultPrevented : null;
  const t1 = ticks;
  await sleep(500);
  return {
    listenersAdded: ctxListeners.map(([t]) => t),
    unremoved: ctxListeners.filter(([t, f]) => !removed.some(([rt, rf]) => rt === t && rf === f)).map(([t]) => t),
    lostFired: !!ev, lostPrevented: prevented, restored, ticksAfterDispose: ticks - t1, stillLost: gl.isContextLost(),
  };
};

// A contact sheet of captures, in order, for eyes rather than for a metric.
window.__strip = (ids, cols) => {
  const caps0 = ids.map((id) => { const c = caps.get(id); if (!c) throw new Error(`no capture ${id}`); return c; });
  const w = caps0[0].w, h = caps0[0].h, PAD = 2;
  const rows = Math.ceil(caps0.length / cols);
  const c = document.createElement('canvas');
  c.width = cols * (w + PAD) + PAD; c.height = rows * (h + PAD) + PAD;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#101010'; ctx.fillRect(0, 0, c.width, c.height);
  caps0.forEach((cap, i) => {
    const img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) img.data.set(cap.bytes.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
    for (let k = 3; k < img.data.length; k += 4) img.data[k] = 255;
    ctx.putImageData(img, PAD + (i % cols) * (w + PAD), PAD + Math.floor(i / cols) * (h + PAD));
  });
  return c.toDataURL('image/png');
};

window.__ready = true;
</script>
